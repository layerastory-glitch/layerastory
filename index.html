<title>Layera Story</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  const tok = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: tok('bg'), tint: tok('tint'), surface: tok('surface'), ink: tok('ink'), mute: tok('mute'), line: tok('line'),
          accent: tok('accent'), 'on-accent': tok('on-accent'), 'accent-soft': tok('accent-soft'),
          good: tok('good'), 'good-soft': tok('good-soft'),
          warn: tok('warn'), 'warn-soft': tok('warn-soft'),
          bad: tok('bad'), 'bad-soft': tok('bad-soft'),
        },
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'],
          serif: ['"Cormorant Garamond"', 'Georgia', 'Times New Roman', 'serif'],
        },
      },
    },
  };
</script>
<style>
  :root {
    --bg: 255 255 255; --surface: 255 255 255; --tint: 250 246 239; --ink: 43 29 26; --mute: 122 106 99; --line: 230 219 200;
    --accent: 164 25 43; --on-accent: 255 248 240; --accent-soft: 246 225 220;
    --good: 47 107 63; --good-soft: 229 238 220;
    --warn: 154 98 0; --warn-soft: 248 232 198;
    --bad: 190 52 24; --bad-soft: 250 224 214;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  ::selection { background: rgb(var(--accent) / 0.22); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body { margin: 0; min-height: 100%; background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  /* Bilah gulir putih untuk daftar pesanan */
  .scroll-white { scrollbar-width: thin; scrollbar-color: #D9CFBD #ffffff; background: #ffffff; }
  .scroll-white::-webkit-scrollbar { width: 10px; height: 10px; background: #ffffff; }
  .scroll-white::-webkit-scrollbar-track { background: #ffffff; }
  .scroll-white::-webkit-scrollbar-thumb { background: #D9CFBD; border-radius: 9999px; border: 2px solid #ffffff; }
  .scroll-white::-webkit-scrollbar-thumb:hover { background: #C9BCA4; }
  .scroll-white::-webkit-scrollbar-corner { background: #ffffff; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }

  /* Lembar invoice selalu terang, apa pun tema perangkat */
  .sheet {
    --surface: 255 255 255; --ink: 43 29 26; --mute: 122 106 99; --line: 230 219 200;
    --accent: 164 25 43; --accent-soft: 247 232 226; --on-accent: 255 248 240;
    --good: 47 107 63; --good-soft: 229 238 220; --warn: 154 98 0; --warn-soft: 248 232 198; --bad: 190 52 24; --bad-soft: 250 224 214;
    color: rgb(43 29 26);
  }

  @media print {
    @page { size: A4; margin: 0; }
    :root { padding: 0 !important; }
    html, body { background: #fff !important; height: auto !important; overflow: visible !important; }
    .no-print { display: none !important; }
    .print-flush { padding: 0 !important; margin: 0 !important; max-width: none !important; }
    .break-avoid { break-inside: avoid; }
    .modal-shell { position: static !important; inset: auto !important; background: none !important; overflow: visible !important; padding: 0 !important; }
    .sheet { box-shadow: none !important; margin: 0 !important; border-radius: 0 !important; width: 210mm !important; max-width: none !important; min-height: 297mm !important; padding: 14mm !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  // Input angka bulat dengan pemisah ribuan titik (nilai yang disimpan = string digit)
  const fmtDigits = (d) => (d === '' || d === undefined || d === null ? '' : Number(d).toLocaleString('id-ID'));
  function NumInput({ value, onChange, prefix, placeholder = '0', label }) {
    const ref = useRef(null);
    const caret = useRef(null);
    useLayoutEffect(() => {
      if (caret.current !== null && ref.current && document.activeElement === ref.current) ref.current.setSelectionRange(caret.current, caret.current);
      caret.current = null;
    });
    const handle = (e) => {
      const raw = e.target.value;
      const pos = e.target.selectionStart == null ? raw.length : e.target.selectionStart;
      const before = raw.slice(0, pos).replace(/\D/g, '').length;
      const digits = raw.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
      const formatted = fmtDigits(digits);
      let c = 0, seen = 0;
      while (c < formatted.length && seen < before) { if (/\d/.test(formatted[c])) seen++; c++; }
      caret.current = c;
      onChange(digits);
    };
    return html`
      <div class="relative">
        ${prefix && html`<span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs text-mute">${prefix}</span>`}
        <input ref=${ref} type="text" inputMode="numeric" autoComplete="off" aria-label=${label} placeholder=${placeholder}

      </div>`;
  }

  function Combo({ value, onChange, options, placeholder, label }) {
    const [open, setOpen] = useState(false);
    const [filtering, setFiltering] = useState(false);
    const box = useRef(null);
    useEffect(() => {
      if (!open) return;
      const away = (e) => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
      document.addEventListener('mousedown', away);
      document.addEventListener('touchstart', away);
      return () => { document.removeEventListener('mousedown', away); document.removeEventListener('touchstart', away); };
    }, [open]);
    const q = value.trim().toLowerCase();
    const list = filtering && q ? options.filter((o) => o.toLowerCase().includes(q)) : options;
    const show = () => { setFiltering(false); setOpen(true); };
    return html`
      <div class="relative" ref=${box}>
        <input class="${inp} pr-8" value=${value} placeholder=${placeholder} aria-label=${label} autoComplete="off" role="combobox" aria-expanded=${open}
          onFocus=${show} onClick=${show}
          onChange=${(e) => { setFiltering(true); setOpen(true); onChange(e.target.value); }}

              </li>`)}

      </div>`;
  }

  function Summary({ orders, label }) {
    const s = useMemo(() => {

      const paid = orders.reduce((a, o) => a + paidAmount(o), 0);
      return { rev, exp, profit: rev - exp, margin: rev ? ((rev - exp) / rev) * 100 : 0, paid, due: rev - paid, count: orders.length };
    }, [orders]);
    const expPct = s.rev ? Math.min(100, Math.max(0, (s.exp / s.rev) * 100)) : 0;
    const profitPct = s.profit > 0 ? 100 - expPct : 0;
    const neg = s.profit < 0;
    return html`

    const t = hTag(o);
    return html`
      <div>
        <p>${fmtShort(o.tanggalAcara)}</p>
        ${t && html`<span class=${'mt-1 inline-block rounded-full px-1.5 py-0.5 text-[10px] font-bold ' + t.cls}>${t.label}</span>`}
      </div>`;
  }

  function EventLine({ o }) {
    if (!o.tanggalAcara) return null;
    const t = hTag(o);
    return html`
      <p class="mt-0.5 flex items-center gap-1.5 text-xs text-mute">
        Acara ${fmtShort(o.tanggalAcara)}
        ${t && html`<span class=${'rounded-full px-1.5 py-0.5 text-[10px] font-bold ' + t.cls}>${t.label}</span>`}
      </p>`;
  }

  function GroupHead({ g }) {
    const all = g.all || g.rows;
    const rev = all.reduce((a, o) => a + orderTotal(o), 0);
    const profit = all.reduce((a, o) => a + orderProfit(o), 0);
    return html`
      <div class="flex flex-wrap items-baseline justify-between gap-x-5 gap-y-1">
        <p class="font-serif text-lg font-semibold leading-tight">
          ${monthTitle(g.key)} <span class="font-sans text-xs font-normal text-mute">${all.length} pesanan</span>
        </p>
        <p class="flex gap-4 text-xs text-mute tabular-nums">
          <span>Omzet <b class="font-semibold text-ink">${rupiah(rev)}</b></span>
          <span>Laba <b class="font-semibold ${profit < 0 ? 'text-bad' : 'text-good'}">${rupiah(profit)}</b></span>
        </p>
      </div>`;
  }

  function OrderList({ rows, allRows, onProgress, ...actions }) {
    if (!rows.length) {
      return html`
        <div class="flex flex-col items-center gap-2 px-6 py-14 text-center">
          <${Icon} name="inbox" size=${32} className="text-mute" />
          <p class="font-semibold">Belum ada pesanan yang cocok</p>
          <p class="max-w-sm text-sm text-mute">Klik “Pesanan baru” untuk mencatat order, atau ubah periode, kata kunci, dan filter status.</p>
        </div>`;
    }
    const groups = groupByMonth(rows).map((g) => ({ ...g, all: (allRows || rows).filter((o) => o.tanggal.slice(0, 7) === g.key) }));
    return html`
      <div>
        <div class="scroll-white hidden overflow-x-auto md:block">
          <table class="w-full min-w-[1180px] text-left text-sm">
            <thead class="border-b border-line text-xs text-mute">
              <tr>
                <th rowSpan="2" class="px-3 py-2.5 align-bottom font-semibold">Klien dan invoice</th>
                <th rowSpan="2" class="px-3 py-2.5 align-bottom font-semibold">Produk</th>
                <th colSpan="3" class="border-b border-line px-3 pb-1.5 pt-2.5 text-center font-semibold">Tanggal</th>
                <th rowSpan="2" class="px-3 py-2.5 text-right align-bottom font-semibold">Nilai order</th>
                <th rowSpan="2" class="px-3 py-2.5 text-right align-bottom font-semibold">Laba</th>
                <th rowSpan="2" class="px-3 py-2.5 align-bottom font-semibold">Pembayaran</th>
                <th rowSpan="2" class="px-3 py-2.5 align-bottom font-semibold">Pekerjaan</th>
                <th rowSpan="2" class="px-3 py-2.5"><span class="sr-only">Aksi</span></th>
              </tr>
              <tr>
                <th class="px-3 py-1.5 font-semibold">Pesan</th>
                <th class="px-3 py-1.5 font-semibold">Deadline</th>
                <th class="px-3 py-1.5 font-semibold">Acara</th>
              </tr>
            </thead>
            ${groups.map((g) => html`
              <tbody key=${g.key} class="divide-y divide-line border-t border-line first:border-t-0">
                <tr><td colSpan="10" class="bg-tint px-3 py-2.5"><${GroupHead} g=${g} /></td></tr>
                ${g.rows.map((o) => {
                  const total = orderTotal(o), profit = orderProfit(o);
                  return html`
                    <tr key=${o.id} class="align-top hover:bg-tint/60">
                      <td class="px-3 py-3"><p class="font-semibold">${o.nama}</p><p class="text-xs text-mute">${o.id}</p></td>
                      <td class="px-3 py-3"><p>${orderSummary(o)}</p><p class="text-xs text-mute tabular-nums">${orderQty(o).toLocaleString('id-ID')} pcs, ${(o.items || []).length} jenis</p></td>
                      <td class="whitespace-nowrap px-3 py-3 tabular-nums">${fmtShort(o.tanggal)}</td>
                      <td class="whitespace-nowrap px-3 py-3 tabular-nums">${fmtShort(o.deadline)}</td>
                      <td class="whitespace-nowrap px-3 py-3 tabular-nums"><${AcaraCell} o=${o} /></td>
                      <td class="whitespace-nowrap px-3 py-3 text-right tabular-nums"><p class="font-semibold">${rupiah(total)}</p><p class="text-xs text-mute">HPP ${rupiah(orderCost(o))}</p></td>
                      <td class="whitespace-nowrap px-3 py-3 text-right tabular-nums"><p class="font-semibold ${profit < 0 ? 'text-bad' : ''}">${rupiah(profit)}</p><p class="text-xs text-mute">${pct(total ? (profit / total) * 100 : 0)}</p></td>
                      <td class="px-3 py-3"><${Badge} status=${o.status} />${o.status === 'dp' && html`<p class="mt-1 whitespace-nowrap text-xs text-mute tabular-nums">${rupiah(o.dp)}</p>`}</td>
                      <td class="px-3 py-3"><${ProgressSelect} o=${o} onChange=${onProgress} /></td>
                      <td class="px-3 py-3"><${RowActions} o=${o} ...${actions} /></td>
                    </tr>`;
                })}
              </tbody>`)}
          </table>
        </div>

        <div class="md:hidden">
          ${groups.map((g) => html`
            <div key=${g.key} class="border-t border-line first:border-t-0">
              <div class="bg-tint px-4 py-2.5"><${GroupHead} g=${g} /></div>
              <ul class="divide-y divide-line">
                ${g.rows.map((o) => {
                  const total = orderTotal(o), profit = orderProfit(o);
                  return html`
                    <li key=${o.id} class="space-y-3 p-4">
                      <div class="flex items-start justify-between gap-3">
                        <div><p class="font-semibold">${o.nama}</p><p class="text-xs text-mute">${o.id}</p></div>
                        <${Badge} status=${o.status} />
                      </div>
                      <p class="text-sm">${orderSummary(o)} <span class="text-mute tabular-nums">· ${orderQty(o).toLocaleString('id-ID')} pcs</span></p>
                      <dl class="grid grid-cols-3 gap-2 text-xs">
                        <div><dt class="text-mute">Nilai order</dt><dd class="tabular-nums font-semibold">${rupiah(total)}</dd></div>
                        <div><dt class="text-mute">HPP</dt><dd class="tabular-nums">${rupiah(orderCost(o))}</dd><dd class="tabular-nums text-mute">${rupiah(costPerPcs(o))} / pcs</dd></div>
                        <div><dt class="text-mute">Laba</dt><dd class="tabular-nums font-semibold ${profit < 0 ? 'text-bad' : ''}">${rupiah(profit)}</dd></div>
                      </dl>
                      <dl class="grid grid-cols-3 gap-2 text-xs">
                        <div><dt class="text-mute">Pesan</dt><dd class="tabular-nums">${fmtShort(o.tanggal)}</dd></div>
                        <div><dt class="text-mute">Deadline</dt><dd class="tabular-nums">${fmtShort(o.deadline)}</dd></div>
                        <div><dt class="text-mute">Acara</dt><dd class="tabular-nums"><${AcaraCell} o=${o} /></dd></div>
                      </dl>
                      <${ProgressSelect} o=${o} onChange=${onProgress} />
                      <${RowActions} o=${o} ...${actions} />
                    </li>`;
                })}
              </ul>
            </div>`)}
        </div>
      </div>`;
  }

  /* ---------- Pagination ---------- */
  function Pagination({ page, pageCount, total, size, onPage }) {
    if (!total) return null;
    const from = (page - 1) * size + 1;
    const to = Math.min(total, page * size);
    const nums = [];
    for (let i = 1; i <= pageCount; i++) {
      if (i === 1 || i === pageCount || Math.abs(i - page) <= 1) nums.push(i);
      else if (nums[nums.length - 1] !== '…') nums.push('…');
    }
    const pb = 'inline-flex h-9 min-w-9 items-center justify-center rounded-lg border px-2 text-sm font-semibold transition-colors';
    const idle = 'border-line bg-surface text-ink hover:bg-tint disabled:opacity-40 disabled:hover:bg-surface';
    return html`
      <nav class="flex flex-col items-center justify-between gap-3 border-t border-line px-4 py-3 sm:flex-row" aria-label="Halaman daftar pesanan">
        <p class="text-xs tabular-nums text-mute">Menampilkan ${from}–${to} dari ${total} pesanan</p>
        ${pageCount > 1 && html`
          <div class="flex items-center gap-1">
            <button class="${pb} ${idle}" disabled=${page === 1} onClick=${() => onPage(page - 1)} aria-label="Halaman sebelumnya"><${Icon} name="chevron-left" size=${16} /></button>
            ${nums.map((n, i) => n === '…'
              ? html`<span key=${'e' + i} class="px-1 text-mute" aria-hidden="true">…</span>`
              : html`<button key=${n} class="${pb} ${n === page ? 'border-accent bg-accent text-on-accent' : idle}" aria-current=${n === page ? 'page' : null} onClick=${() => onPage(n)}>${n}</button>`)}
            <button class="${pb} ${idle}" disabled=${page === pageCount} onClick=${() => onPage(page + 1)} aria-label="Halaman berikutnya"><${Icon} name="chevron-right" size=${16} /></button>
          </div>`}
      </nav>`;
  }

  /* ---------- Agenda acara (pengingat hari H) ---------- */
  function EventCard({ o, onInvoice }) {
    const d = daysUntil(o.tanggalAcara);
    const today = d === 0;
    const dt = new Date(o.tanggalAcara + 'T00:00:00');
    const sisa = orderTotal(o) - paidAmount(o);
    const idx = progressIdx(o);
    const prog = progressOf(o);
    const wa = String(o.wa || '').replace(/\D/g, '').replace(/^0/, '62');
    const countdown = today ? 'Hari H' : d === 1 ? 'Besok' : 'H-' + d;
    const chip = today ? 'bg-white text-accent' : d === 1 ? 'bg-warn-soft text-warn' : 'bg-accent-soft text-accent';
    const sub = today ? 'text-on-accent/80' : 'text-mute';
    const act = today ? `${btn} bg-white text-accent hover:opacity-90` : btnGhost;
    return html`
      <article class=${'flex w-[17.5rem] shrink-0 snap-start flex-col rounded-2xl border p-4 sm:w-auto ' + (today ? 'border-accent bg-accent text-on-accent' : 'border-line bg-surface')}>
        <div class="flex items-start gap-3">
          <div class=${'w-14 shrink-0 overflow-hidden rounded-xl text-center ' + (today ? 'bg-white text-accent' : 'border border-line bg-surface text-ink')}>
            <p class=${'py-0.5 text-[11px] font-semibold ' + (today ? 'bg-accent-soft text-accent' : 'bg-accent text-on-accent')}>${MONTHS_SHORT[dt.getMonth()]}</p>
            <p class="py-1.5 font-serif text-2xl font-bold leading-none">${dt.getDate()}</p>
          </div>
          <div class="min-w-0 flex-1">
            <p class="truncate font-serif text-xl font-semibold leading-tight">${o.nama}</p>
            <p class=${'mt-0.5 text-xs ' + sub}>${dt.toLocaleDateString('id-ID', { weekday: 'long' })}, ${fmtShort(o.tanggalAcara)}</p>
          </div>
          <span class=${'shrink-0 rounded-full px-2.5 py-0.5 text-xs font-bold ' + chip}>${countdown}</span>
        </div>

        <p class=${'mt-3 text-sm ' + (today ? '' : 'text-ink')}>${orderSummary(o)} <span class=${sub}>(${orderQty(o).toLocaleString('id-ID')} pcs)</span></p>

        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <${Badge} status=${o.status} />
          <span class=${'inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ' + prog.cls}>${prog.label}</span>
        </div>
        <div class="mt-2.5 flex gap-0.5" aria-hidden="true">
          ${[0, 1, 2, 3].map((i) => html`<span key=${i} class=${'h-1 flex-1 rounded-full ' + (i < idx ? (today ? 'bg-white' : idx === 4 ? 'bg-good' : 'bg-accent') : (today ? 'bg-white/30' : 'bg-line'))}></span>`)}
        </div>
        ${sisa > 0 && html`<p class=${'mt-3 text-sm ' + sub}>Sisa tagihan <span class=${'font-bold tabular-nums ' + (today ? 'text-on-accent' : 'text-warn')}>${rupiah(sisa)}</span></p>`}

        <div class="mt-auto flex gap-2 pt-4">
          <button class=${act} onClick=${() => onInvoice(o)}><${Icon} name="printer" size=${15} /> Invoice</button>
          ${wa && html`<a class=${act} href=${'https://wa.me/' + wa} target="_blank" rel="noopener noreferrer"><${Icon} name="message" size=${15} /> WhatsApp</a>`}
        </div>
      </article>`;
  }

  function ReminderBar({ orders, onInvoice, onDismiss }) {
    const withEvent = orders.filter((o) => o.tanggalAcara);
    const hari = withEvent.filter((o) => daysUntil(o.tanggalAcara) === 0);
    const soon = withEvent.filter((o) => { const d = daysUntil(o.tanggalAcara); return d > 0 && d <= 7; }).sort((a, b) => a.tanggalAcara.localeCompare(b.tanggalAcara));
    if (!hari.length && !soon.length) return null;
    const parts = [];
    if (hari.length) parts.push(`${hari.length} acara hari ini`);
    if (soon.length) parts.push(`${soon.length} dalam 7 hari ke depan`);
    return html`
      <section role="status" aria-label="Agenda acara" class="rounded-2xl border border-line bg-surface p-4 md:p-5">
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-3">
            <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-accent-soft text-accent"><${Icon} name="bell" size=${20} /></span>
            <div>
              <h2 class="font-serif text-xl font-semibold leading-tight">${hari.length ? 'Hari H hari ini' : 'Acara minggu ini'}</h2>
              <p class="text-xs text-mute">${parts.join(', ')}</p>
            </div>
          </div>
          <button class="rounded-lg p-1.5 text-mute hover:text-ink" onClick=${onDismiss} aria-label="Tutup agenda acara"><${Icon} name="x" size=${16} /></button>
        </div>
        <div class="-mx-1 mt-4 flex snap-x gap-3 overflow-x-auto px-1 pb-1 sm:mx-0 sm:grid sm:grid-cols-2 sm:overflow-visible sm:px-0 sm:pb-0 lg:grid-cols-3">
          ${[...hari, ...soon].map((o) => html`<${EventCard} key=${o.id} o=${o} onInvoice=${onInvoice} />`)}
        </div>
      </section>`;
  }

  /* ---------- Pemilih periode (tahun dan bulan) ---------- */
  function PeriodBar({ years, months, year, month, total, onYear, onMonth }) {
    const pill = (active) => `whitespace-nowrap rounded-full border px-3 py-1.5 text-xs font-semibold transition-colors ${active ? 'border-accent bg-accent text-on-accent' : 'border-line bg-surface text-mute hover:text-ink'}`;
    const cnt = (n) => html`<span class="tabular-nums opacity-80">${n}</span>`;
    return html`
      <section class="space-y-3 rounded-2xl border border-line bg-surface p-4" aria-label="Pilih periode">
        <div class="flex items-center gap-3">
          <span class="w-12 shrink-0 text-xs font-semibold text-mute">Tahun</span>
          <div class="flex gap-2 overflow-x-auto py-0.5">
            <button class=${pill(year === 'semua')} onClick=${() => onYear('semua')}>Semua ${cnt(total)}</button>
            ${years.map((y) => html`<button key=${y.key} class=${pill(year === y.key)} onClick=${() => onYear(y.key)}>${y.key} ${cnt(y.count)}</button>`)}
          </div>
        </div>
        ${year !== 'semua' && html`
          <div class="flex items-center gap-3">
            <span class="w-12 shrink-0 text-xs font-semibold text-mute">Bulan</span>
            <div class="flex gap-2 overflow-x-auto py-0.5">
              <button class=${pill(month === 'semua')} onClick=${() => onMonth('semua')}>Semua bulan</button>
              ${months.map((m) => html`<button key=${m.key} class=${pill(month === m.key)} onClick=${() => onMonth(m.key)}>${MONTHS_SHORT[Number(m.key) - 1]} ${cnt(m.count)}</button>`)}
            </div>
          </div>`}
      </section>`;
  }

  /* ---------- Form pesanan ---------- */
  let uidSeq = 0;
  const uid = () => 'r' + Date.now().toString(36) + (uidSeq++);
  const blankItem = () => ({ uid: uid(), jenis: '', produk: '', qty: '', price: '', total: '', ket: '', src: 'price' });
  const blankExpense = (kategori) => ({ uid: uid(), kategori, nama: '', qty: '', satuan: '', price: '', total: '', src: 'price' });
  const blankOrder = (orders) => {
    const tanggal = todayISO();
    return { id: nextInvoiceId(orders, tanggal), kode: uniqueKode(orders), tanggal, deadline: addDays(tanggal, 14), tanggalAcara: '', nama: '', wa: '', alamat: '', status: 'belum', progress: 'belum', dp: '',
      items: [blankItem()], expenses: KATEGORI.map((k) => blankExpense(k.key)) };
  };
  const totalStr = (l) => { const t = lineTotal(l); return t ? String(Math.round(t)) : ''; };
  const toForm = (o) => ({
    ...o, tanggalAcara: o.tanggalAcara || '', dp: o.dp ? String(o.dp) : '',
    items: (o.items || []).map((l) => ({ uid: uid(), jenis: l.jenis || '', produk: l.produk || '', qty: String(l.qty ?? ''), price: String(l.price ?? ''), total: totalStr(l), ket: l.ket || '', src: 'price' })),
    expenses: (o.expenses || []).map((e) => ({ uid: uid(), kategori: e.kategori, nama: e.nama || '', qty: String(e.qty ?? ''), satuan: e.satuan || '', price: String(e.price ?? ''), total: totalStr(e), src: 'price' })),
  });
  const filledItem = (l) => l.jenis.trim() || l.produk.trim() || l.qty || l.price || l.total;
  const filledExpense = (x) => x.nama.trim() || x.qty || x.price || x.total;
  const rowTotal = (r) => (r.total !== '' ? num(r.total) : Math.round(num(r.qty) * num(r.price)));
  const fromForm = (f) => ({
    ...f, id: f.id.trim(), nama: f.nama.trim(), dp: f.status === 'dp' ? num(f.dp) : 0,
    items: f.items.filter(filledItem).map((l) => ({ jenis: l.jenis.trim(), produk: l.produk.trim(), qty: num(l.qty), price: num(l.price), total: rowTotal(l), ket: (l.ket || '').trim() })),
    expenses: f.expenses.filter(filledExpense).map((x) => ({ kategori: x.kategori, nama: x.nama.trim(), qty: num(x.qty), satuan: x.satuan.trim(), price: num(x.price), total: rowTotal(x) })),
  });

  // Hitung ulang satu baris: isi harga satuan -> total = jumlah x harga; isi total -> harga satuan = total / jumlah
  const recalc = (row, k, v) => {
    const r = { ...row, [k]: v };
    const q = num(r.qty);
    if (k === 'price') {
      r.src = 'price';
      r.total = v !== '' && q > 0 ? String(Math.round(q * num(v))) : '';
    } else if (k === 'total') {
      if (v === '') { r.src = 'price'; r.price = ''; }
      else { r.src = 'total'; if (q > 0) r.price = String(Math.round(num(v) / q)); }
    } else if (k === 'qty') {
      if (r.src === 'total') { if (r.total !== '' && q > 0) r.price = String(Math.round(num(r.total) / q)); }
      else r.total = r.price !== '' && q > 0 ? String(Math.round(q * num(r.price))) : '';
    }
    return r;
  };

  const Cell = ({ label, className = '', children }) => html`
    <div class="block ${className}">
      <span class="mb-1 block text-xs font-semibold text-mute md:hidden">${label}</span>
      ${children}
    </div>`;
  const RemoveBtn = ({ onClick, label }) => html`
    <button type="button" onClick=${onClick} aria-label=${label}
      class="col-span-2 inline-flex h-[38px] items-center justify-center gap-1.5 justify-self-end rounded-lg px-2.5 text-xs font-semibold text-mute hover:bg-tint hover:text-bad md:col-span-1 md:w-[38px] md:px-0">
      <${Icon} name="trash" size=${16} /><span class="md:hidden">Hapus baris</span>
    </button>`;
  const AutoNote = ({ r }) => (r.src === 'total' && r.price !== '' ? html`<span class="mt-1 block text-[11px] text-mute">dihitung dari total</span>` : null);
  const ITEM_COLS = 'md:grid-cols-[1.1fr_1.4fr_0.7fr_1.1fr_1.1fr_1.5fr_38px]';
  const EXP_COLS = 'md:grid-cols-[2fr_0.8fr_1fr_1.3fr_1.3fr_38px]';
  const colHead = ({ cols, labels }) => html`
    <div class="hidden gap-3 px-0 pb-1 text-xs font-semibold text-mute md:grid ${cols}">
      ${labels.map((t, i) => html`<span key=${i}>${t}</span>`)}<span></span>
    </div>`;

  function OrderForm({ orders, editing, settings, onSave, onClose }) {
    const [f, setF] = useState(() => (editing ? toForm(editing) : blankOrder(orders)));
    const [idManual, setIdManual] = useState(!!editing);
    const [errors, setErrors] = useState({});
    const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
    const patch = (list, id, k, v) => setF((p) => ({ ...p, [list]: p[list].map((r) => (r.uid === id ? recalc(r, k, v) : r)) }));
    const addRow = (list, row) => setF((p) => ({ ...p, [list]: [...p[list], row] }));
    const delRow = (list, id) => setF((p) => ({ ...p, [list]: p[list].filter((r) => r.uid !== id) }));
    const onTanggal = (v) => setF((p) => ({ ...p, tanggal: v, id: !idManual && v ? nextInvoiceId(orders, v) : p.id }));

    const total = sumLines(f.items);
    const cost = sumLines(f.expenses);
    const qtyAll = f.items.reduce((a, l) => a + num(l.qty), 0);
    const profit = total - cost;
    const margin = total ? (profit / total) * 100 : 0;
    const perPcs = qtyAll ? cost / qtyAll : 0;

    const submit = () => {
      const e = {};
      if (!f.id.trim()) e.id = 'Nomor invoice wajib diisi.';
      else if (orders.some((o) => o.id === f.id.trim() && (!editing || o.id !== editing.id))) e.id = 'Nomor invoice ini sudah dipakai.';
      if (!f.nama.trim()) e.nama = 'Nama klien wajib diisi.';
      if (f.deadline && f.tanggal && f.deadline < f.tanggal) e.deadline = 'Deadline lebih awal dari tanggal order.';
      const items = f.items.filter(filledItem);
      if (!items.length) e.items = 'Tambahkan minimal satu jenis pesanan.';
      else if (items.some((l) => !l.jenis.trim() || !l.produk.trim())) e.items = 'Setiap baris pesanan perlu nama jenis dan nama produk.';
      else if (items.some((l) => !(num(l.qty) > 0))) e.items = 'Jumlah tiap jenis pesanan minimal 1 pcs.';
      const exps = f.expenses.filter(filledExpense);
      if (exps.some((x) => !x.nama.trim())) e.expenses = 'Isi nama pengeluaran pada setiap baris yang sudah memiliki angka.';
      else if (exps.some((x) => !(num(x.qty) > 0))) e.expenses = 'Jumlah tiap pengeluaran minimal 1.';
      if (f.status === 'dp' && !(num(f.dp) > 0)) e.dp = 'Isi nominal DP yang sudah diterima.';
      else if (f.status === 'dp' && num(f.dp) > total) e.dp = 'DP tidak boleh melebihi nilai order.';
      setErrors(e);
      if (Object.keys(e).length) return;
      onSave(fromForm(f), editing);
    };

    const sectionTitle = 'mb-3 text-sm font-bold';
    const saran = (key) => (key === 'hpp' ? settings.saranHpp : settings.saranProduksi) || [];
    return html`
      <${Modal} onClose=${onClose} closeOnBackdrop=${false} width="max-w-4xl">
        <div class="flex min-h-full flex-col bg-surface sm:min-h-0 sm:rounded-2xl sm:border sm:border-line">
          <div class="flex items-center justify-between border-b border-line px-5 py-4">
            <h2 class="text-lg font-bold">${editing ? 'Ubah pesanan' : 'Pesanan baru'}</h2>
            <button class="rounded-lg p-2 text-mute hover:bg-tint" onClick=${onClose} aria-label="Tutup"><${Icon} name="x" /></button>
          </div>

          <div class="flex-1 space-y-8 px-5 py-5">
            <section>
              <h3 class=${sectionTitle}>Data pesanan</h3>
              <div class="grid gap-4 sm:grid-cols-2">
                <${Field} label="No. invoice" error=${errors.id} hint="Dibuat otomatis, boleh diubah manual.">
                  <input class=${inp} value=${f.id} onChange=${(e) => { setIdManual(true); set('id', e.target.value); }} />
                <//>
                <div class="grid grid-cols-2 gap-3">
                  <${Field} label="Tanggal order"><input type="date" class=${inp} value=${f.tanggal} onChange=${(e) => onTanggal(e.target.value)} /><//>
                  <${Field} label="Deadline pengerjaan" error=${errors.deadline}><input type="date" class=${inp} value=${f.deadline} onChange=${(e) => set('deadline', e.target.value)} /><//>
                </div>
                <${Field} label="Nama klien" error=${errors.nama}><input class=${inp} placeholder="Nama calon pengantin atau PIC" value=${f.nama} onChange=${(e) => set('nama', e.target.value)} /><//>
                <${Field} label="No. WhatsApp / kontak"><input class=${inp} inputMode="tel" placeholder="0812-xxxx-xxxx" value=${f.wa} onChange=${(e) => set('wa', e.target.value)} /><//>
                <${Field} label="Tanggal acara (internal)" hint="Untuk pengingat hari H di dashboard. Tidak tampil di invoice.">
                  <input type="date" class=${inp} value=${f.tanggalAcara} onChange=${(e) => set('tanggalAcara', e.target.value)} />
                <//>
                <${Field} label="Status pekerjaan">
                  <select class=${inp} value=${f.progress || 'belum'} onChange=${(e) => set('progress', e.target.value)}>
                    ${PROGRESS.map((x) => html`<option key=${x.key} value=${x.key}>${x.label}</option>`)}
                  </select>
                <//>
                <${Field} label="Alamat pengiriman" className="sm:col-span-2"><textarea rows="2" class=${inp} value=${f.alamat} onChange=${(e) => set('alamat', e.target.value)}></textarea><//>
              </div>
            </section>

            <section>
              <h3 class="mb-1 text-sm font-bold">Jenis dan produk yang dipesan</h3>
              <p class="mb-3 text-xs text-mute">Satu klien bisa memesan beberapa jenis. Ketik nama jenis dan nama produk secara terpisah. Isi harga satuan, atau isi total saja dan harga satuan dihitung otomatis.</p>
              <div class="space-y-3">
                <${colHead} cols=${ITEM_COLS} labels=${['Jenis', 'Nama produk', 'Jumlah (pcs)', 'Harga satuan', 'Total', 'Keterangan']} />
                ${f.items.map((l, i) => html`
                  <div key=${l.uid} class="grid grid-cols-2 gap-3 rounded-xl border border-line p-3 md:items-start md:rounded-none md:border-0 md:p-0 ${ITEM_COLS}">
                    <${Cell} label="Jenis" className="col-span-2 md:col-span-1"><input class=${inp} aria-label="Jenis" autoComplete="off" placeholder="Ketik jenis, mis. Softcover" value=${l.jenis} onChange=${(e) => patch('items', l.uid, 'jenis', e.target.value)} /><//>
                    <${Cell} label="Nama produk" className="col-span-2 md:col-span-1"><input class=${inp} aria-label="Nama produk" placeholder="Nama atau tema desain" value=${l.produk} onChange=${(e) => patch('items', l.uid, 'produk', e.target.value)} /><//>
                    <${Cell} label="Jumlah (pcs)"><${NumInput} label="Jumlah" value=${l.qty} onChange=${(v) => patch('items', l.uid, 'qty', v)} /><//>
                    <${Cell} label="Harga satuan"><${MoneyInput} label="Harga satuan" value=${l.price} onChange=${(v) => patch('items', l.uid, 'price', v)} /><${AutoNote} r=${l} /><//>
                    <${Cell} label="Total" className="col-span-2 md:col-span-1"><${MoneyInput} label="Total" value=${l.total} onChange=${(v) => patch('items', l.uid, 'total', v)} /><//>
                    <${Cell} label="Keterangan (opsional)" className="col-span-2 md:col-span-1"><input class=${inp} aria-label="Keterangan" autoComplete="off" placeholder="Opsional" value=${l.ket} onChange=${(e) => patch('items', l.uid, 'ket', e.target.value)} /><//>
                    <${RemoveBtn} onClick=${() => delRow('items', l.uid)} label=${'Hapus jenis pesanan ' + (i + 1)} />
                  </div>`)}
              </div>
              ${errors.items && html`<p class="mt-2 text-xs font-medium text-bad">${errors.items}</p>`}
              <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
                <button type="button" class=${btnGhost} onClick=${() => addRow('items', blankItem())}><${Icon} name="plus" size=${16} /> Tambah jenis</button>
                <p class="text-sm text-mute tabular-nums">${qtyAll.toLocaleString('id-ID')} pcs, total nilai order <span class="font-bold text-ink">${rupiah(total)}</span></p>
              </div>

              <div class="mt-6">
                <p class="mb-1 text-xs font-semibold text-mute">Status pembayaran</p>
                <div class="inline-flex rounded-lg border border-line bg-tint p-1" role="radiogroup" aria-label="Status pembayaran">
                  ${Object.entries(STATUS).map(([k, v]) => html`
                    <button type="button" key=${k} role="radio" aria-checked=${f.status === k}
                      class="rounded-md px-3.5 py-1.5 text-sm font-semibold transition-colors ${f.status === k ? 'bg-accent text-on-accent' : 'text-mute hover:text-ink'}"
                      onClick=${() => set('status', k)}>${v.label}</button>`)}
                </div>
                ${f.status === 'dp' && html`
                  <div class="mt-3 grid max-w-md grid-cols-[1fr_auto] items-end gap-2">
                    <${Field} label="Nominal DP diterima" error=${errors.dp}><${MoneyInput} label="Nominal DP" value=${f.dp} onChange=${(v) => set('dp', v)} /><//>
                    <button type="button" class="${btnGhost} h-[38px]" onClick=${() => set('dp', String(Math.round(total / 2)))}>50%</button>
                  </div>`}
              </div>
            </section>

            <section>
              <h3 class="mb-1 text-sm font-bold">Pengeluaran HPP dan produksi</h3>
              <p class="mb-3 text-xs text-mute">Tambahkan sebanyak apa pun jenis pengeluaran. Nama boleh diketik bebas atau dipilih dari daftar (daftar bisa diatur di Pengaturan). Isi harga satuan, atau isi total saja dan harga satuan dihitung otomatis.</p>
              <div class="space-y-5">
                ${KATEGORI.map((k) => {
                  const rows = f.expenses.filter((x) => x.kategori === k.key);
                  return html`
                    <div key=${k.key} class="rounded-xl border border-line p-4">
                      <div class="mb-3 flex flex-wrap items-baseline justify-between gap-x-3">
                        <p class="text-sm font-semibold">${k.title} <span class="text-xs font-normal text-mute">${k.hint}</span></p>
                        <p class="tabular-nums text-sm font-semibold">${rupiah(sumLines(rows))}</p>
                      </div>
                      ${rows.length === 0 && html`<p class="mb-3 text-sm text-mute">Belum ada baris. Klik tombol di bawah untuk menambah pengeluaran ${k.title}.</p>`}
                      <div class="space-y-3">
                        <${colHead} cols=${EXP_COLS} labels=${['Nama pengeluaran', 'Jumlah', 'Satuan', 'Harga satuan', 'Total']} />
                        ${rows.map((x) => html`
                          <div key=${x.uid} class="grid grid-cols-2 gap-3 rounded-lg border border-line p-3 md:items-start md:rounded-none md:border-0 md:p-0 ${EXP_COLS}">
                            <${Cell} label="Nama pengeluaran" className="col-span-2 md:col-span-1"><${Combo} label="Nama pengeluaran" options=${saran(k.key)} placeholder="Pilih atau ketik jenis" value=${x.nama} onChange=${(v) => patch('expenses', x.uid, 'nama', v)} /><//>
                            <${Cell} label="Jumlah"><input type="number" min="0" step="any" inputMode="decimal" aria-label="Jumlah" class="${inp} tabular-nums" value=${x.qty} onChange=${(e) => patch('expenses', x.uid, 'qty', e.target.value)} /><//>
                            <${Cell} label="Satuan"><${Combo} label="Satuan" options=${settings.satuan || []} placeholder="Pilih satuan" value=${x.satuan} onChange=${(v) => patch('expenses', x.uid, 'satuan', v)} /><//>
                            <${Cell} label="Harga satuan"><${MoneyInput} label="Harga satuan" value=${x.price} onChange=${(v) => patch('expenses', x.uid, 'price', v)} /><${AutoNote} r=${x} /><//>
                            <${Cell} label="Total"><${MoneyInput} label="Total" value=${x.total} onChange=${(v) => patch('expenses', x.uid, 'total', v)} /><//>
                            <${RemoveBtn} onClick=${() => delRow('expenses', x.uid)} label=${'Hapus pengeluaran ' + (x.nama || 'tanpa nama')} />
                          </div>`)}
                      </div>
                      <button type="button" class="${btnGhost} mt-3" onClick=${() => addRow('expenses', blankExpense(k.key))}><${Icon} name="plus" size=${16} /> Tambah pengeluaran ${k.title}</button>
                    </div>`;
                })}
              </div>
              ${errors.expenses && html`<p class="mt-2 text-xs font-medium text-bad">${errors.expenses}</p>`}
              <p class="mt-3 text-right text-sm text-mute">Total pengeluaran <span class="tabular-nums text-base font-bold text-ink">${rupiah(cost)}</span></p>
            </section>
          </div>

          <div class="sticky bottom-0 border-t border-line bg-surface px-5 py-4 sm:rounded-b-2xl">
            <div class="mb-3 grid grid-cols-2 gap-3 text-sm sm:grid-cols-5">
              <div><p class="text-xs text-mute">Nilai order</p><p class="tabular-nums font-semibold">${rupiah(total)}</p></div>
              <div><p class="text-xs text-mute">Total pengeluaran</p><p class="tabular-nums font-semibold">${rupiah(cost)}</p></div>
              <div><p class="text-xs text-mute">HPP per undangan</p><p class="tabular-nums font-semibold">${rupiah(perPcs)}</p></div>
              <div><p class="text-xs text-mute">Laba</p><p class="tabular-nums font-semibold ${profit < 0 ? 'text-bad' : 'text-good'}">${rupiah(profit)}</p></div>
              <div><p class="text-xs text-mute">Margin</p><p class="tabular-nums font-semibold ${profit < 0 ? 'text-bad' : ''}">${pct(margin)}</p></div>
            </div>
            ${Object.keys(errors).length > 0 && html`<p class="mb-3 text-sm font-medium text-bad">Ada isian yang perlu diperbaiki, lihat pesan merah di atas.</p>`}
            <div class="flex justify-end gap-2">
              <button class=${btnGhost} onClick=${onClose}>Batal</button>
              <button class=${btnPrimary} onClick=${submit}><${Icon} name="check" size=${16} /> Simpan pesanan</button>
            </div>
          </div>
        </div>
      <//>`;
  }

  /* ---------- Laporan keuangan bulanan ---------- */
  const shiftYm = (ym, n) => {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1 + n, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  };
  const ymTitle = (ym) => `${MONTHS[Number(ym.slice(5, 7)) - 1]} ${ym.slice(0, 4)}`;
  const norm = (t) => String(t || '').trim().toLowerCase();
  const compact = (n) => {
    const a = Math.abs(n);
    const f = (v, u) => (Math.round(v * 10) / 10).toLocaleString('id-ID') + ' ' + u;
    if (a >= 1e9) return f(n / 1e9, 'M');
    if (a >= 1e6) return f(n / 1e6, 'jt');
    if (a >= 1e3) return f(n / 1e3, 'rb');
    return String(Math.round(n));
  };
  const chg = (cur, prev) => {
    if (!prev) return cur ? 'baru' : '-';
    const d = ((cur - prev) / Math.abs(prev)) * 100;
    return (d > 0 ? '+' : d < 0 ? '−' : '') + pct(Math.abs(d));
  };
  const chgCls = (cur, prev, goodUp) => (!goodUp || !prev || cur === prev ? 'text-mute' : cur > prev ? 'text-good' : 'text-bad');

  const monthStats = (orders, ym) => {
    const list = orders.filter((o) => o.tanggal.slice(0, 7) === ym).sort((a, b) => (a.tanggal + a.id).localeCompare(b.tanggal + b.id));
    const sum = (fn) => list.reduce((a, o) => a + fn(o), 0);
    const omzet = sum(orderTotal);
    const hpp = sum((o) => sumLines((o.expenses || []).filter((e) => e.kategori === 'hpp')));
    const cost = sum(orderCost);
    const paid = sum(paidAmount);
    return {
      ym, list, count: list.length, qty: sum(orderQty), omzet, hpp, produksi: cost - hpp, cost, profit: omzet - cost,
      margin: omzet ? ((omzet - cost) / omzet) * 100 : 0, paid, due: omzet - paid,
      byStatus: { lunas: list.filter((o) => o.status === 'lunas').length, dp: list.filter((o) => o.status === 'dp').length, belum: list.filter((o) => o.status === 'belum').length },
    };
  };

  function TrendChart({ data }) {
    const W = 640, H = 230, L = 58, R = 8, T = 12, B = 28;
    const max = Math.max(1, ...data.flatMap((d) => [d.omzet, d.cost, Math.max(0, d.profit)]));
    const plotH = H - T - B;
    const group = (W - L - R) / data.length;
    const bw = Math.min(16, (group - 14) / 3);
    const y = (v) => T + plotH - (Math.max(0, v) / max) * plotH;
    const ticks = [0, 0.5, 1];
    return html`
      <svg viewBox=${'0 0 ' + W + ' ' + H} class="h-auto w-full" role="img" aria-label="Grafik batang omzet, pengeluaran, dan laba enam bulan terakhir">
        ${ticks.map((t) => html`
          <g key=${t}>
            <line x1=${L} x2=${W - R} y1=${y(max * t)} y2=${y(max * t)} class="stroke-line" stroke-width="1" />
            <text x=${L - 6} y=${y(max * t) + 3} textAnchor="end" fontSize="10" class="fill-mute">${compact(max * t)}</text>
          </g>`)}
        ${data.map((d, i) => {
          const gx = L + i * group + (group - (bw * 3 + 8)) / 2;
          const bars = [[d.omzet, 'fill-accent'], [d.cost, 'fill-mute'], [d.profit, 'fill-good']];
          return html`
            <g key=${d.ym}>
              ${bars.map(([v, cls], j) => html`<rect key=${j} x=${gx + j * (bw + 4)} y=${y(v)} width=${bw} height=${Math.max(0, T + plotH - y(v))} rx="2" class=${cls} />`)}
              <text x=${L + i * group + group / 2} y=${H - 9} textAnchor="middle" fontSize="11" class=${d.ym === data[data.length - 1].ym ? 'fill-ink font-semibold' : 'fill-mute'}>${MONTHS_SHORT[Number(d.ym.slice(5, 7)) - 1]}</text>
            </g>`;
        })}
      </svg>`;
  }

  function ReportControls({ ym, onYm, years }) {
    const [note, setNote] = useState(null);
    const y = ym.slice(0, 4), m = ym.slice(5, 7);
    const sel = `${inp} !w-auto`;
    return html`
      <div class="no-print flex flex-wrap items-center gap-2 rounded-2xl border border-line bg-surface p-3">
        <button class="${btnGhost} !px-2.5" onClick=${() => onYm(shiftYm(ym, -1))} aria-label="Bulan sebelumnya"><${Icon} name="chevron-left" size=${16} /></button>
        <select class=${sel} aria-label="Bulan laporan" value=${m} onChange=${(e) => onYm(y + '-' + e.target.value)}>
          ${MONTHS.map((n, i) => html`<option key=${n} value=${String(i + 1).padStart(2, '0')}>${n}</option>`)}
        </select>
        <select class=${sel} aria-label="Tahun laporan" value=${y} onChange=${(e) => onYm(e.target.value + '-' + m)}>
          ${years.map((v) => html`<option key=${v} value=${v}>${v}</option>`)}
        </select>
        <button class="${btnGhost} !px-2.5" onClick=${() => onYm(shiftYm(ym, 1))} aria-label="Bulan berikutnya"><${Icon} name="chevron-right" size=${16} /></button>
        <button class=${btnGhost} onClick=${() => onYm(todayISO().slice(0, 7))}>Bulan ini</button>
        <button class="${btnPrimary} ml-auto" onClick=${() => { setNote(null); tryPrint(() => setNote(PRINT_BLOCKED)); }}><${Icon} name="printer" size=${16} /> Cetak laporan</button>
        ${note && html`<p role="status" class="w-full rounded-lg bg-warn-soft px-3 py-2 text-sm font-medium text-warn">${note}</p>`}
      </div>`;
  }

  function ReportView({ orders, settings, ym }) {
    const st = useMemo(() => monthStats(orders, ym), [orders, ym]);
    const prev = useMemo(() => monthStats(orders, shiftYm(ym, -1)), [orders, ym]);
    const trend = useMemo(() => [-5, -4, -3, -2, -1, 0].map((n) => monthStats(orders, shiftYm(ym, n))), [orders, ym]);
    const ytd = useMemo(() => {
      const y = ym.slice(0, 4), m = ym.slice(5, 7);
      const list = orders.filter((o) => o.tanggal.slice(0, 4) === y && o.tanggal.slice(5, 7) <= m);
      const omzet = list.reduce((a, o) => a + orderTotal(o), 0);
      const cost = list.reduce((a, o) => a + orderCost(o), 0);
      return { omzet, cost, profit: omzet - cost, count: list.length };
    }, [orders, ym]);
    const expense = useMemo(() => KATEGORI.map((k) => {
      const map = {};
      st.list.forEach((o) => (o.expenses || []).filter((e) => e.kategori === k.key).forEach((e) => {
        const key = norm(e.nama) || '(tanpa nama)';
        map[key] = map[key] || { nama: e.nama || '(tanpa nama)', total: 0 };
        map[key].total += lineTotal(e);
      }));
      const rows = Object.values(map).sort((a, b) => b.total - a.total);
      return { ...k, rows, total: rows.reduce((a, r) => a + r.total, 0) };
    }), [st]);
    const jenis = useMemo(() => {
      const map = {};
      st.list.forEach((o) => (o.items || []).forEach((l) => {
        const key = norm(l.jenis) || '(tanpa jenis)';
        map[key] = map[key] || { jenis: l.jenis || '(tanpa jenis)', qty: 0, total: 0 };
        map[key].qty += num(l.qty);
        map[key].total += lineTotal(l);
      }));
      return Object.values(map).sort((a, b) => b.total - a.total);
    }, [st]);

    const neg = st.profit < 0;
    const th = 'px-3 py-2 text-xs font-semibold';
    const td = 'px-3 py-2';
    const num2 = 'text-right tabular-nums';
    const h3 = 'mb-2 font-serif text-xl font-semibold';
    const kpi = [
      { label: 'Omzet', value: rupiah(st.omzet), sub: `${chg(st.omzet, prev.omzet)} dari bulan lalu`, subCls: chgCls(st.omzet, prev.omzet, true) },
      { label: 'Total pengeluaran', value: rupiah(st.cost), sub: `${chg(st.cost, prev.cost)} dari bulan lalu`, subCls: 'text-mute' },
      { label: 'Laba bersih', value: rupiah(st.profit), cls: neg ? 'text-bad' : 'text-good', sub: `${chg(st.profit, prev.profit)} dari bulan lalu`, subCls: chgCls(st.profit, prev.profit, true) },
      { label: 'Margin keuntungan', value: pct(st.margin), cls: neg ? 'text-bad' : '', sub: `Bulan lalu ${pct(prev.margin)}`, subCls: 'text-mute' },
    ];
    const plRow = (label, cur, before, opts = {}) => html`
      <tr class=${(opts.bold ? 'font-bold ' : '') + (opts.top ? 'border-t-2 border-accent ' : 'border-t border-line ')}>
        <td class=${td + (opts.indent ? ' pl-7 text-mute' : '')}>${label}</td>
        <td class="${td} ${num2} ${opts.cls || ''}">${rupiah(cur)}</td>
        <td class="${td} ${num2} text-mute">${rupiah(before)}</td>
        <td class="${td} ${num2} ${chgCls(cur, before, opts.goodUp)}">${chg(cur, before)}</td>
      </tr>`;

    return html`
      <article class="sheet mx-auto w-full max-w-[210mm] rounded-sm border border-line bg-surface p-6 text-ink shadow-sm sm:p-[14mm]">
        <header class="flex flex-wrap items-start justify-between gap-4 border-b-2 border-accent pb-5">
          <div class="flex items-center gap-3">
            <img src=${LOGO_SRC} alt=${settings.nama || 'Layera Story'} width="900" height="299" draggable="false" class="h-14 w-auto shrink-0 select-none" />
            <div>
              <p class="text-xs text-mute">${settings.tagline}</p>
              <p class="text-xs text-mute">${settings.alamat}</p>
            </div>
          </div>
          <div class="text-right">
            <h1 class="font-serif text-3xl font-semibold leading-none text-accent">Laporan Keuangan</h1>
            <p class="mt-2 text-sm font-semibold">Periode ${ymTitle(ym)}</p>
            <p class="text-xs text-mute">Disusun ${fmtDate(todayISO())}</p>
          </div>
        </header>

        <section class="break-avoid mt-6 grid grid-cols-2 gap-px overflow-hidden rounded-lg border border-line bg-line sm:grid-cols-4" aria-label="Ringkasan bulan ini">
          ${kpi.map((k) => html`
            <div key=${k.label} class="bg-surface p-3">
              <p class="text-xs font-semibold text-mute">${k.label}</p>
              <p class="mt-1 text-lg font-bold tabular-nums ${k.cls || ''}">${k.value}</p>
              <p class="mt-0.5 text-xs ${k.subCls}">${k.sub}</p>

  /* ---------- Cetak dan unduh ---------- */
  // Browser memblokir window.print() di dalam iframe artifact; bila tidak ada dialog cetak yang terbuka, beri tahu pengguna.
  function tryPrint(onBlocked) {
    let fired = false;
    const mark = () => { fired = true; };
    window.addEventListener('beforeprint', mark);
    try { window.print(); } catch (e) { window.removeEventListener('beforeprint', mark); onBlocked(); return; }
    setTimeout(() => { window.removeEventListener('beforeprint', mark); if (!fired) onBlocked(); }, 600);
  }
  const PRINT_BLOCKED = 'Cetak langsung diblokir oleh pratinjau artifact. Gunakan Unduh PDF lalu cetak dari file PDF-nya, atau buka halaman ini langsung di tab browser.';

  // Simpan file lewat fitur unduhan artifact (dengan konfirmasi); cadangan: unduhan biasa bila halaman dibuka langsung di tab
  async function saveFile(filename, bytes, mime = 'application/pdf') {
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) return dl.save({ filename, data: bytes });
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    return { status: 'saved' };
  }

  /* ---------- Invoice ---------- */
  // Tanda cek (6 karakter) dihitung dari kode + status + total + dibayar: QR berubah setiap kali salah satunya berubah
  const qrSig = (o) => {
    let x = 2166136261;
    for (const ch of `${kodeFor(o)}|${o.status}|${orderTotal(o)}|${paidAmount(o)}`) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619) >>> 0; }
    let out = '';
    for (let i = 0; i < 6; i++) { x = (Math.imul(x, 1664525) + 1013904223) >>> 0; out += KODE_CHARS[(x >>> 16) % KODE_CHARS.length]; }
    return out;
  };
  const rpPlain = (n) => 'Rp ' + num(n).toLocaleString('id-ID');
  // Isi QR (teks biasa, terbaca saat dipindai): nomor, status, nominal, kode unik, tanda cek
  const qrPayload = (o) => {
    const total = orderTotal(o), paid = paidAmount(o);
    return `Invoice ${o.id} | Status ${STATUS[o.status].label.toUpperCase()} | Total ${rpPlain(total)} | Dibayar ${rpPlain(paid)} | Sisa ${rpPlain(total - paid)} | Kode ${kodeFor(o)} | Cek ${qrSig(o)}`;
  };

  function QrCode({ value }) {
    let path = '', n = 0;
    try {
      const qr = qrcode(0, 'M');
      qr.addData(value);
      qr.make();
      n = qr.getModuleCount();
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) path += `M${c + 4} ${r + 4}h1v1h-1z`;
    } catch (e) { path = ''; }
    if (!path) return html`<div class="grid h-28 w-28 place-items-center text-center text-xs text-mute">QR code gagal dimuat</div>`;
    return html`
      <svg viewBox=${'0 0 ' + (n + 8) + ' ' + (n + 8)} shapeRendering="crispEdges" class="block h-28 w-28" role="img" aria-label=${'QR code ' + value}>
        <rect width=${n + 8} height=${n + 8} fill="#ffffff" />
        <path d=${path} fill="#1B1210" />
      </svg>`;
  }

  // Membuat PDF A4 sungguhan (teks bisa dipilih, QR tajam) langsung dari data pesanan
  async function buildDocPdf(o, s) {
    const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
    const doc = await PDFDocument.create();
    doc.setTitle('Invoice ' + o.id);
    doc.setAuthor(s.nama);
    const F = {
      r: await doc.embedFont(StandardFonts.Helvetica), b: await doc.embedFont(StandardFonts.HelveticaBold), i: await doc.embedFont(StandardFonts.HelveticaOblique),
      sb: await doc.embedFont(StandardFonts.TimesRomanBold), si: await doc.embedFont(StandardFonts.TimesRomanItalic),
    };
    const c = (r, g, b) => rgb(r / 255, g / 255, b / 255);
    const C = { ink: c(43, 29, 26), mute: c(122, 106, 99), line: c(230, 219, 200), accent: c(164, 25, 43), soft: c(247, 232, 226), good: c(47, 107, 63), warn: c(154, 98, 0), bad: c(190, 52, 24), white: c(255, 255, 255) };
    const W = 595.28, H = 841.89, M = 42;
    let page = doc.addPage([W, H]);
    let y = H - M;

    const clean = (t) => String(t == null ? '' : t).replace(/[\u00a0\u202f]/g, ' ').replace(/\u2212/g, '-').replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"').replace(/\u2013/g, '-');
    const safe = (font, t) => Array.from(clean(t)).map((ch) => { try { font.encodeText(ch); return ch; } catch (e) { return '?'; } }).join('');
    const text = (t, x, yy, o2 = {}) => {
      const { size = 10, font = F.r, color = C.ink, align = 'left' } = o2;
      const str = safe(font, t);
      const w = font.widthOfTextAtSize(str, size);
      page.drawText(str, { x: align === 'right' ? x - w : align === 'center' ? x - w / 2 : x, y: yy, size, font, color });
      return w;
    };
    const wrap = (t, font, size, maxW) => {
      const out = [];
      safe(font, t).split('\n').forEach((para) => {
        let line = '';
        para.split(/\s+/).filter(Boolean).forEach((w) => {
          const test = line ? line + ' ' + w : w;
          if (font.widthOfTextAtSize(test, size) <= maxW) line = test;
          else { if (line) out.push(line); line = w; }
        });
        out.push(line);
      });
      return out;
    };
    const hline = (yy, color, thickness, x1 = M, x2 = W - M) => page.drawLine({ start: { x: x1, y: yy }, end: { x: x2, y: yy }, thickness, color });

    const total = orderTotal(o), paid = paidAmount(o), sisa = total - paid;
    const stColor = o.status === 'lunas' ? C.good : o.status === 'dp' ? C.warn : C.bad;

    // Kop
    let kopH = 62;
    let logoImg = null;
    try { logoImg = await doc.embedPng(Uint8Array.from(atob(LOGO_B64), (ch) => ch.charCodeAt(0))); } catch (e) { logoImg = null; }
    if (logoImg) {
      const lh = 40, lw = lh * (logoImg.width / logoImg.height);
      page.drawImage(logoImg, { x: M, y: y - lh, width: lw, height: lh });
      text(s.tagline, M, y - lh - 12, { size: 8.5, color: C.mute });
      text(s.alamat, M, y - lh - 22, { size: 8.5, color: C.mute });
      text(s.kontak, M, y - lh - 32, { size: 8.5, color: C.mute });
      kopH = lh + 42;
    } else {
      page.drawCircle({ x: M + 20, y: y - 20, size: 20, borderColor: C.accent, borderWidth: 1.6 });
      text((s.nama || 'A').trim().charAt(0).toUpperCase(), M + 20, y - 27, { size: 22, font: F.sb, color: C.accent, align: 'center' });
      text(s.nama, M + 52, y - 14, { size: 19, font: F.sb });
      text(s.tagline, M + 52, y - 27, { size: 8.5, color: C.mute });
      text(s.alamat, M + 52, y - 38, { size: 8.5, color: C.mute });
      text(s.kontak, M + 52, y - 48, { size: 8.5, color: C.mute });
    }
    text('Invoice', W - M, y - 20, { size: 28, font: F.sb, color: C.accent, align: 'right' });
    text('No. ' + o.id, W - M, y - 36, { size: 9, color: C.mute, align: 'right' });
    y -= kopH;
    hline(y, C.accent, 1.6);
    y -= 24;

    // Klien dan keterangan
    const top = y;
    text('Ditagihkan kepada', M, y, { size: 8, font: F.b, color: C.mute }); y -= 15;
    text(o.nama, M, y, { size: 12.5, font: F.b }); y -= 14;
    if (o.wa) { text(o.wa, M, y, { size: 9.5 }); y -= 12; }
    if (o.alamat) wrap(o.alamat, F.r, 9, 250).forEach((l) => { text(l, M, y, { size: 9, color: C.mute }); y -= 11; });
    let ry = top;
    [['Tanggal order', fmtDate(o.tanggal), C.ink], ['Deadline pengerjaan', fmtDate(o.deadline), C.ink], ['Status pembayaran', STATUS[o.status].label, stColor]].forEach(([k, v, col]) => {
      text(k, W - M - 175, ry, { size: 9, color: C.mute });
      text(v, W - M, ry, { size: 9.5, font: F.b, color: col, align: 'right' });
      ry -= 15;
    });
    y = Math.min(y, ry) - 14;

    // Tabel item
    const xQty = M + 338, xPrice = M + 424, xTotal = W - M - 8;
    const tableHead = () => {
      page.drawRectangle({ x: M, y: y - 19, width: W - 2 * M, height: 22, color: C.soft });
      text('Jenis dan produk', M + 8, y - 11, { size: 8.5, font: F.b });
      text('Jumlah', xQty, y - 11, { size: 8.5, font: F.b, align: 'right' });
      text('Harga satuan', xPrice, y - 11, { size: 8.5, font: F.b, align: 'right' });

  /* ======================================================================
     KEAMANAN: autentikasi dan enkripsi data (lokal, di browser)
     - Password tidak pernah disimpan. Yang disimpan: salt acak + verifier hasil PBKDF2-SHA256 (600.000 iterasi) lalu HKDF.
     - Data pesanan dan pengaturan dienkripsi AES-GCM 256-bit dengan kunci turunan password; kunci hanya ada di memori.
     - Pembatasan percobaan, sesi hanya di memori, kunci otomatis saat tidak aktif.
     Seluruh bagian ini diganti Supabase Auth saat aplikasi dihosting sendiri (lihat panduan-supabase.md).
     ====================================================================== */
  const SECURE_KEY = 'aksara.secure.v1';
  const LOCK_KEY = 'aksara.lock.v1';
  const PBKDF2_ITER = 600000;
  const TEMP_USER = 'admin';
  const TEMP_PASSWORD = 'admin12'; // sementara: wajib diganti saat masuk pertama kali
  const IDLE_MS = 15 * 60 * 1000;
  const te = new TextEncoder();
  const td = new TextDecoder();
  const b64 = (u8) => { let t = ''; u8.forEach((x) => { t += String.fromCharCode(x); }); return btoa(t); };
  const unb64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
  const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const ctEqual = (a, b) => { if (a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i]; return d === 0; };
  const hasCrypto = () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false);

  async function makeKeys(password, saltB64, iter) {
    const base = await crypto.subtle.importKey('raw', te.encode(password.normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
    const master = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(saltB64), iterations: iter }, base, 256);
    const hk = await crypto.subtle.importKey('raw', master, 'HKDF', false, ['deriveBits', 'deriveKey']);
    const zero = new Uint8Array(32);
    const verifier = new Uint8Array(await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: zero, info: te.encode('aksara/auth') }, hk, 256));
    const key = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: zero, info: te.encode('aksara/enc') }, hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    return { verifier, key };
  }
  async function seal(key, label, value) {
    const iv = rand(12);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(label) }, key, te.encode(JSON.stringify(value)));
    return { iv: b64(iv), ct: b64(new Uint8Array(ct)) };
  }
  async function unseal(key, label, blob) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv), additionalData: te.encode(label) }, key, unb64(blob.ct));
    return JSON.parse(td.decode(pt));
  }
  const readSecure = () => { try { const v = localStorage.getItem(SECURE_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
  const writeSecure = (rec) => localStorage.setItem(SECURE_KEY, JSON.stringify(rec));
  const readLock = () => { try { return JSON.parse(localStorage.getItem(LOCK_KEY)) || { fails: 0, until: 0 }; } catch (e) { return { fails: 0, until: 0 }; } };
  const writeLock = (l) => { try { localStorage.setItem(LOCK_KEY, JSON.stringify(l)); } catch (e) { /* abaikan */ } };
  const registerFail = () => {
    const l = readLock();
    l.fails += 1;
    if (l.fails % 5 === 0) l.until = Date.now() + Math.min(15 * 60 * 1000, 30000 * 2 ** (l.fails / 5 - 1));
    writeLock(l);
    return l;
  };

  // Catatan akun dibuat acak per perangkat: salt unik, password sementara tidak pernah tersimpan sebagai teks
  async function ensureAuthRecord() {
    const cur = readSecure();
    if (cur && cur.auth) return cur;
    const salt = b64(rand(16));
    const { verifier } = await makeKeys(TEMP_PASSWORD, salt, PBKDF2_ITER);
    const rec = { v: 1, auth: { user: TEMP_USER, salt, iter: PBKDF2_ITER, verifier: b64(verifier), mustChange: true, createdAt: Date.now() }, data: null };
    writeSecure(rec);
    return rec;
  }

  // Selalu menjalankan PBKDF2 penuh, baik username benar maupun salah (waktu proses sama)
  async function authenticate(username, password) {
    const lock = readLock();
    if (lock.until > Date.now()) return { ok: false, locked: lock.until };
    const rec = readSecure();
    const t0 = Date.now();
    const { verifier, key } = await makeKeys(password, rec.auth.salt, rec.auth.iter);
    const pad = (t) => te.encode(String(t).padEnd(64).slice(0, 64));
    const userOk = ctEqual(pad(username.trim().toLowerCase()), pad(rec.auth.user));
    const passOk = ctEqual(verifier, unb64(rec.auth.verifier));
    if (!(userOk && passOk)) {
      const l = registerFail();
      await sleep(Math.max(0, 600 - (Date.now() - t0)));
      return { ok: false, locked: l.until > Date.now() ? l.until : 0 };
    }
    writeLock({ fails: 0, until: 0 });
    return { ok: true, rec, key };
  }

  const COMMON_PW = ['password', 'password1', 'password123', '12345678', '123456789', '1234567890', 'qwerty123', 'qwertyuiop', 'admin123', 'admin1234', 'admin12', 'administrator', 'letmein123', 'welcome123', 'iloveyou', 'passw0rd', 'abc12345', 'aksara', 'undangan', 'percetakan'];
  const isWeakPw = (pw, user) => {
    const low = pw.toLowerCase();
    return !pw || COMMON_PW.some((c) => low === c || low === c + '!') || low.includes(String(user).toLowerCase()) || /^(.)\1+$/.test(pw) || '0123456789'.includes(low) || 'abcdefghijklmnopqrstuvwxyz'.includes(low);
  };
  const pwChecks = (pw, user) => [
    { ok: pw.length >= 10, label: 'Minimal 10 karakter' },
    { ok: /[a-z]/.test(pw) && /[A-Z]/.test(pw), label: 'Huruf besar dan huruf kecil' },
    { ok: /\d/.test(pw), label: 'Minimal satu angka' },
    { ok: pw.length > 0 && !isWeakPw(pw, user) && pw.length <= 128, label: 'Bukan password umum dan tidak memuat username' },
  ];
  const pwScore = (pw) => (pw.length >= 10 ? 1 : 0) + (pw.length >= 14 ? 1 : 0) + (/[a-z]/.test(pw) && /[A-Z]/.test(pw) && /\d/.test(pw) ? 1 : 0) + (/[^A-Za-z0-9]/.test(pw) ? 1 : 0);
  const PW_LABEL = ['Sangat lemah', 'Lemah', 'Cukup', 'Kuat', 'Sangat kuat'];

  async function openData(rec, key) {
    if (!rec.data) return { orders: initOrders(), settings: { ...DEFAULT_SETTINGS } };
    return { orders: await unseal(key, 'orders', rec.data.orders), settings: { ...DEFAULT_SETTINGS, ...(await unseal(key, 'settings', rec.data.settings)) } };
  }

  // Sesi: kunci enkripsi hanya hidup di memori; penyimpanan diserialkan agar tidak saling menimpa
  function createSession(rec0, key0, data) {
    let rec = rec0, key = key0, queue = Promise.resolve();
    const cache = { orders: data.orders, settings: data.settings };
    const run = (fn) => { const p = queue.then(fn); queue = p.catch(() => {}); return p; };
    const api = {
      user: rec.auth.user,
      onSaveError: null,
      initial: { orders: data.orders, settings: data.settings },
      save: (label, value) => { cache[label] = value; return run(async () => { const blob = await seal(key, label, value); rec = { ...rec, data: { ...(rec.data || {}), [label]: blob } }; writeSecure(rec); }).catch((e) => { if (api.onSaveError) api.onSaveError(e); }); },
      flush: () => queue,
      changePassword: (current, next) => run(async () => {
        const lock = readLock();
        if (lock.until > Date.now()) return { ok: false, error: 'Terlalu banyak percobaan. Coba lagi beberapa saat lagi.' };
        const cur = await makeKeys(current, rec.auth.salt, rec.auth.iter);
        if (!ctEqual(cur.verifier, unb64(rec.auth.verifier))) { registerFail(); return { ok: false, error: 'Password saat ini salah.' }; }
        if (!pwChecks(next, rec.auth.user).every((c) => c.ok)) return { ok: false, error: 'Password baru belum memenuhi syarat.' };
        const salt = b64(rand(16));
        const nk = await makeKeys(next, salt, PBKDF2_ITER);
        const dataBlobs = { orders: await seal(nk.key, 'orders', cache.orders), settings: await seal(nk.key, 'settings', cache.settings) };
        const newRec = { v: 1, auth: { ...rec.auth, salt, iter: PBKDF2_ITER, verifier: b64(nk.verifier), mustChange: false, changedAt: Date.now() }, data: dataBlobs };
        writeSecure(newRec);
        rec = newRec; key = nk.key;
        writeLock({ fails: 0, until: 0 });
        return { ok: true };
      }),
    };
    return api;
  }

  // Masuk pertama kali: ganti password sementara lalu pindahkan data lama (tersimpan polos) ke penyimpanan terenkripsi
  async function firstChange(tempPassword, next) {
    const rec = readSecure();
    const cur = await makeKeys(tempPassword, rec.auth.salt, rec.auth.iter);
    if (!ctEqual(cur.verifier, unb64(rec.auth.verifier))) return { ok: false, error: 'Sesi tidak valid. Muat ulang halaman lalu masuk lagi.' };
    if (!pwChecks(next, rec.auth.user).every((c) => c.ok)) return { ok: false, error: 'Password baru belum memenuhi syarat.' };
    const salt = b64(rand(16));
    const nk = await makeKeys(next, salt, PBKDF2_ITER);
    const data = { orders: initOrders(), settings: { ...DEFAULT_SETTINGS, ...load(KEY_S, {}) } };
    const newRec = { v: 1, auth: { ...rec.auth, salt, iter: PBKDF2_ITER, verifier: b64(nk.verifier), mustChange: false, changedAt: Date.now() },
      data: { orders: await seal(nk.key, 'orders', data.orders), settings: await seal(nk.key, 'settings', data.settings) } };
    try { writeSecure(newRec); } catch (e) { return { ok: false, error: 'Penyimpanan browser penuh atau tidak tersedia.' }; }
    [KEY_O, KEY_O_V2, KEY_O_V1, KEY_S].forEach((k) => { try { localStorage.removeItem(k); } catch (e) { /* abaikan */ } });
    return { ok: true, session: createSession(newRec, nk.key, data) };
  }
  const wipeDevice = () => { [SECURE_KEY, LOCK_KEY, KEY_O, KEY_O_V2, KEY_O_V1, KEY_S].forEach((k) => { try { localStorage.removeItem(k); } catch (e) { /* abaikan */ } }); };

  function LoginScreen({ onLogin, notice, onReset, onEmailReset }) {
    const [user, setUser] = useState('');

    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const [lockUntil, setLockUntil] = useState(() => readLock().until);
    const [now, setNow] = useState(Date.now());
    const [forgot, setForgot] = useState(false);

    useEffect(() => {
      if (lockUntil <= Date.now()) return undefined;
      const t = setInterval(() => setNow(Date.now()), 500);
      return () => clearInterval(t);
    }, [lockUntil]);
    const remaining = Math.max(0, Math.ceil((lockUntil - now) / 1000));
    const locked = remaining > 0;
    const submit = async (e) => {
      e.preventDefault();
      if (busy || locked || !user.trim() || !pw) return;
      setBusy(true); setErr('');
      const r = await onLogin(user, pw);

      if (!r.ok) {

          ${forgot && (onEmailReset ? html`
            <div class="mt-3 space-y-2 text-left text-xs text-mute">
              <p>Tautan untuk membuat password baru akan dikirim ke email admin yang terdaftar.</p>
              <button type="button" class="${btn} w-full border border-line bg-surface text-ink hover:bg-tint" disabled=${emailBusy} onClick=${sendReset}>${emailBusy ? 'Mengirim...' : 'Kirim tautan reset'}</button>
              ${emailMsg && html`<p role="status" class="font-medium text-accent">${emailMsg}</p>`}
            </div>` : html`
            <div class="mt-3 space-y-2 text-left text-xs text-mute">
              <p>Data terenkripsi tidak bisa dibuka tanpa password, dan tidak ada pemulihan otomatis. Satu-satunya cara adalah menghapus data di browser ini dan mulai dari awal (password kembali ke bawaan).</p>
              <input class=${inp} value=${confirmText} onChange=${(e) => setConfirmText(e.target.value)} placeholder="Ketik HAPUS untuk konfirmasi" aria-label="Konfirmasi hapus data" />
              <button type="button" class="${btn} w-full border border-line bg-surface text-bad hover:bg-tint" disabled=${confirmText !== 'HAPUS'} onClick=${onReset}>Hapus data di browser ini</button>
            </div>`)}
        </div>
      <//>`;
  }

  function ChangePasswordForm({ askCurrent, onSubmit, onCancel, submitLabel = 'Simpan password' }) {

      e.preventDefault();

      setErr('');
      if (askCurrent && !cur) { setErr('Isi password saat ini.'); return; }

      if (nw !== cf) { setErr('Konfirmasi password tidak sama.'); return; }
      if (askCurrent && nw === cur) { setErr('Password baru harus berbeda dari password saat ini.'); return; }
      setBusy(true);
      const r = await onSubmit(cur, nw);
      setBusy(false);
      if (r && !r.ok) { setErr(r.error || 'Gagal mengganti password.'); setCur(''); }

    const barCls = (i) => (i < score ? (score <= 1 ? 'bg-bad' : score === 2 ? 'bg-warn' : 'bg-good') : 'bg-line');
    return html`

        <ul class="space-y-1 text-xs">

        </ul>
        <${PasswordField} label="Ulangi password baru" value=${cf} onChange=${setCf} autoComplete="new-password" />
        ${err && html`<p role="alert" class="text-sm font-medium text-bad">${err}</p>`}
        <div class="flex justify-end gap-2">

          <button type="submit" class=${btnPrimary + (onCancel ? '' : ' w-full')} disabled=${busy}><${Icon} name="check" size=${16} /> ${busy ? 'Menyimpan...' : submitLabel}</button>
