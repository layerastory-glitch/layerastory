  function Root() {
    const [phase, setPhase] = useState('boot');
    const [session, setSession] = useState(null);
    const [temp, setTemp] = useState(null);
    const [notice, setNotice] = useState('');
    const [fatal, setFatal] = useState('');
    const boot = async () => {
      if (!hasCrypto()) { setFatal('Browser ini tidak mendukung enkripsi (butuh koneksi HTTPS dan browser terbaru).'); return; }
      try { await ensureAuthRecord(); setPhase('login'); } catch (e) { setFatal('Penyimpanan browser tidak tersedia. Nonaktifkan mode privat atau izinkan penyimpanan situs.'); }
    };
    useEffect(() => { boot(); }, []);
    const login = async (u, p) => {
      const r = await authenticate(u, p);
      if (!r.ok) return r.locked ? { ok: false, locked: r.locked, error: 'Terlalu banyak percobaan gagal.' } : { ok: false, error: 'Username atau password salah.' };
      if (r.rec.auth.mustChange) { setTemp(p); setNotice(''); setPhase('force'); return { ok: true }; }
      try {
        const data = await openData(r.rec, r.key);
        setSession(createSession(r.rec, r.key, data)); setNotice(''); setPhase('app');
        return { ok: true };
      } catch (e) {
        return { ok: false, error: 'Data terenkripsi tidak dapat dibuka. Tidak ada data yang diubah atau dihapus.' };
      }
    };
    const first = async (_cur, next) => {
      const r = await firstChange(temp, next);
      if (r.ok) { setTemp(null); setSession(r.session); setPhase('app'); }
      return r;
    };
    const logout = async (why) => {
      if (session) { try { await session.flush(); } catch (e) { /* abaikan */ } }
      setSession(null); setTemp(null);
      setNotice(why === 'idle' ? 'Sesi dikunci karena tidak ada aktivitas.' : '');
      setPhase('login');
    };
    const reset = async () => { wipeDevice(); setPhase('boot'); await boot(); };

    if (fatal) return html`<${AuthShell} title="Tidak dapat dibuka"><p class="text-sm text-bad">${fatal}</p><//>`;
    if (phase === 'boot') return html`<${AuthShell} title="Menyiapkan..."><p class="text-center text-sm text-mute">Memeriksa penyimpanan aman.</p><//>`;
    if (phase === 'login') return html`<${LoginScreen} onLogin=${login} notice=${notice} onReset=${reset} />`;
    if (phase === 'force') {
      return html`
        <${AuthShell} title="Buat password baru" subtitle="Password sementara hanya untuk masuk pertama kali">
          <${ChangePasswordForm} askCurrent=${false} submitLabel="Simpan dan masuk" onSubmit=${first} />
        <//>`;
    }
    return html`<${App} session=${session} onLogout=${logout} />`;
  }

  /* ---------- Cadangan data: validasi file impor ---------- */
  function parseBackup(text) {
    let d;
    try { d = JSON.parse(text); } catch (e) { return { error: 'File bukan JSON yang valid.' }; }
    if (!d || typeof d !== 'object' || !Array.isArray(d.orders)) return { error: 'Format file tidak dikenali (tidak ada daftar pesanan).' };
    if (d.orders.length > 20000) return { error: 'File terlalu besar.' };
    const ids = new Set();
    const orders = [];
    for (const o of d.orders) {
      if (!o || typeof o !== 'object' || typeof o.id !== 'string' || !o.id.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(String(o.tanggal || ''))) return { error: 'Ada pesanan dengan nomor invoice atau tanggal yang tidak valid.' };
      if (ids.has(o.id)) return { error: 'Ada nomor invoice ganda: ' + o.id };
      ids.add(o.id);
      orders.push({ ...o, status: STATUS[o.status] ? o.status : 'belum', items: Array.isArray(o.items) ? o.items : [], expenses: Array.isArray(o.expenses) ? o.expenses : [] });
    }
    const st = d.settings && typeof d.settings === 'object' ? d.settings : {};
    const settings = { ...DEFAULT_SETTINGS };
    Object.keys(DEFAULT_SETTINGS).forEach((k) => {
      const v = st[k];
      if (Array.isArray(DEFAULT_SETTINGS[k])) { if (Array.isArray(v) && v.every((x) => typeof x === 'string')) settings[k] = v; }
      else if (typeof v === 'string') settings[k] = v;
    });
    return { ok: true, orders, settings };
  }

  /* ======================================================================
     MODE SUPABASE (aktif bila config.js berisi SUPABASE_URL dan SUPABASE_ANON_KEY)
     Password diperiksa di server Supabase (Auth); data disimpan di tabel dengan Row Level Security.
     ====================================================================== */
  const emailFor = (u) => {
    const t = String(u || '').trim();
    if (t.includes('@')) return t;
    const map = { admin: CFG.ADMIN_EMAIL, ...(CFG.USERNAME_EMAIL || {}) };
    return map[t.toLowerCase()] || '';
  };
  async function loadSB(sb) {
    const o = await sb.from('orders').select('data').order('tanggal', { ascending: false });
    if (o.error) throw o.error;
    const st = await sb.from('settings').select('data').maybeSingle();
    if (st.error) throw st.error;
    return { orders: (o.data || []).map((r) => r.data), settings: { ...DEFAULT_SETTINGS, ...((st.data && st.data.data) || {}) } };
  }
  function createSBSession(sb, user, data) {
    const seen = new Map(data.orders.map((o) => [o.id, JSON.stringify(o)]));
    let queue = Promise.resolve();
    const run = (fn) => { const p = queue.then(fn); queue = p.catch(() => {}); return p; };
    const api = {
      user: 'admin',
      onSaveError: null,
      initial: { orders: data.orders, settings: data.settings },
      // Hanya baris yang berubah yang dikirim ke server; baris yang dihapus ikut dihapus di server
      save: (label, value) => run(async () => {
        if (label === 'orders') {
          const changed = value.filter((o) => seen.get(o.id) !== JSON.stringify(o));
          const keep = new Set(value.map((o) => o.id));
          const removed = [...seen.keys()].filter((id) => !keep.has(id));
          if (changed.length) {
            const { error } = await sb.from('orders').upsert(changed.map((o) => ({ id: o.id, owner: user.id, tanggal: o.tanggal, data: o })), { onConflict: 'id' });
            if (error) throw error;
            changed.forEach((o) => seen.set(o.id, JSON.stringify(o)));
          }
          if (removed.length) {
            const { error } = await sb.from('orders').delete().in('id', removed);
            if (error) throw error;
            removed.forEach((id) => seen.delete(id));
          }
        } else {
          const { error } = await sb.from('settings').upsert({ owner: user.id, data: value }, { onConflict: 'owner' });
          if (error) throw error;
        }
      }).catch((e) => { if (api.onSaveError) api.onSaveError(e); }),
      flush: () => queue,
      changePassword: (current, next) => run(async () => {
        if (!pwChecks(next, 'admin').every((c) => c.ok)) return { ok: false, error: 'Password baru belum memenuhi syarat.' };
        const re = await sb.auth.signInWithPassword({ email: user.email, password: current });
        if (re.error) return { ok: false, error: 'Password saat ini salah.' };
        const up = await sb.auth.updateUser({ password: next });
        if (up.error) return { ok: false, error: 'Gagal mengganti password: ' + up.error.message };
        return { ok: true };
      }),
    };
    return api;
  }

  function RootSB() {
    const [phase, setPhase] = useState('boot');
    const [session, setSession] = useState(null);
    const [notice, setNotice] = useState('');
    const [fatal, setFatal] = useState('');
    const sbRef = useRef(null);
    const recovering = useRef(false);

    const enter = async (user) => {
      if (user.user_metadata && user.user_metadata.must_change === true) { setPhase('force'); return { ok: true }; }
      try {
        const data = await loadSB(sbRef.current);
        setSession(createSBSession(sbRef.current, user, data)); setNotice(''); setPhase('app');
        return { ok: true };
      } catch (e) {
        return { ok: false, error: 'Gagal memuat data dari Supabase. Periksa konfigurasi tabel dan kebijakan akses.' };
      }
    };
    useEffect(() => {
      (async () => {
        if (!window.supabase || !window.supabase.createClient) { setFatal('Pustaka Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.'); return; }
        try {
          const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
          sbRef.current = sb;
          sb.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') { recovering.current = true; setPhase('recover'); } });
          const { data } = await sb.auth.getSession();
          if (recovering.current) return;
          if (data && data.session) { const r = await enter(data.session.user); if (!r.ok) { setNotice(r.error); setPhase('login'); } }
          else setPhase('login');
        } catch (e) { setFatal('Tidak dapat terhubung ke Supabase. Periksa SUPABASE_URL dan SUPABASE_ANON_KEY di config.js.'); }
      })();
    }, []);

    const login = async (u, p) => {
      const lock = readLock();
      if (lock.until > Date.now()) return { ok: false, locked: lock.until, error: 'Terlalu banyak percobaan gagal.' };
      const email = emailFor(u);
      const t0 = Date.now();
      const res = email ? await sbRef.current.auth.signInWithPassword({ email, password: p }) : { error: true };
      if (res.error || !res.data || !res.data.user) {
        const l = registerFail();
        await sleep(Math.max(0, 600 - (Date.now() - t0)));
        return { ok: false, locked: l.until > Date.now() ? l.until : 0, error: 'Username atau password salah.' };
      }
      writeLock({ fails: 0, until: 0 });
      return enter(res.data.user);
    };
    const setNew = async (_cur, next) => {
      if (!pwChecks(next, 'admin').every((c) => c.ok)) return { ok: false, error: 'Password baru belum memenuhi syarat.' };
      const up = await sbRef.current.auth.updateUser({ password: next, data: { must_change: false } });
      if (up.error || !up.data || !up.data.user) return { ok: false, error: 'Gagal menyimpan password baru: ' + (up.error ? up.error.message : 'tidak ada respons') };
      recovering.current = false;
      const r = await enter(up.data.user);
      return r.ok ? { ok: true } : r;
    };
    const logout = async (why) => {
      if (session) { try { await session.flush(); } catch (e) { /* abaikan */ } }
      try { await sbRef.current.auth.signOut(); } catch (e) { /* abaikan */ }
      setSession(null);
      setNotice(why === 'idle' ? 'Sesi dikunci karena tidak ada aktivitas.' : '');
      setPhase('login');
    };
    const emailReset = async () => {
      const email = emailFor('admin');
      if (!email) return { error: 'ADMIN_EMAIL belum diisi di config.js.' };
      const r = await sbRef.current.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
      return r.error ? { error: 'Gagal mengirim tautan reset: ' + r.error.message } : { ok: true };
    };

    if (fatal) return html`<${AuthShell} title="Tidak dapat dibuka"><p class="text-sm text-bad">${fatal}</p><//>`;
    if (phase === 'boot') return html`<${AuthShell} title="Menyiapkan..."><p class="text-center text-sm text-mute">Menghubungkan ke server.</p><//>`;
    if (phase === 'login') return html`<${LoginScreen} onLogin=${login} notice=${notice} onEmailReset=${emailReset} />`;
    if (phase === 'force' || phase === 'recover') {
      return html`
        <${AuthShell} title="Buat password baru" subtitle=${phase === 'recover' ? 'Masukkan password baru untuk akun Anda' : 'Password sementara hanya untuk masuk pertama kali'}>
          <${ChangePasswordForm} askCurrent=${false} submitLabel="Simpan dan masuk" onSubmit=${setNew} />
        <//>`;
    }
    return html`<${App} session=${session} onLogout=${logout} />`;
  }

  /* ---------- Aplikasi ---------- */
  function App({ session, onLogout }) {
    const [orders, setOrders] = useState(() => session.initial.orders);
    const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...session.initial.settings }));
    const [showPw, setShowPw] = useState(false);
    const [q, setQ] = useState('');
    const [filter, setFilter] = useState('semua');
    const [year, setYear] = useState(() => todayISO().slice(0, 4));
    const [month, setMonth] = useState(() => todayISO().slice(5, 7));
    const [page, setPage] = useState(1);
    const [remDismissed, setRemDismissed] = useState(false);
    const [tab, setTab] = useState('pesanan');
    const [ym, setYm] = useState(() => todayISO().slice(0, 7));
    const [progFilter, setProgFilter] = useState('semua');
    const [form, setForm] = useState(null);        // { editing: order|null }
    const [invoice, setInvoice] = useState(null);
    const [delTarget, setDelTarget] = useState(null);
    const [showSettings, setShowSettings] = useState(false);
    const [toast, setToast] = useState('');

    useEffect(() => { session.onSaveError = () => setToast('Gagal menyimpan data. Periksa koneksi atau ruang penyimpanan.'); }, []);
    useEffect(() => { session.save('orders', orders); }, [orders]);
    useEffect(() => { session.save('settings', settings); }, [settings]);
    // Kunci otomatis saat tidak ada aktivitas
    useEffect(() => {
      let last = Date.now();
      const bump = () => { last = Date.now(); };
      const evs = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'wheel'];
      evs.forEach((e) => window.addEventListener(e, bump, { passive: true }));
      const t = setInterval(() => { if (Date.now() - last > IDLE_MS) onLogout('idle'); }, 5000);
      return () => { evs.forEach((e) => window.removeEventListener(e, bump)); clearInterval(t); };
    }, []);
    const hariHCount = orders.filter((o) => o.tanggalAcara && daysUntil(o.tanggalAcara) === 0).length;
    useEffect(() => { document.title = (hariHCount ? `(${hariHCount}) Hari H hari ini - ` : '') + 'Layera Story'; }, [hariHCount]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 2600); return () => clearTimeout(t); }, [toast]);

    const sorted = useMemo(() => [...orders].sort((a, b) => (b.tanggal + b.id).localeCompare(a.tanggal + a.id)), [orders]);
    const years = useMemo(() => {
      const m = {};
      orders.forEach((o) => { const y = o.tanggal.slice(0, 4); m[y] = (m[y] || 0) + 1; });
      const cy = todayISO().slice(0, 4);
      if (!m[cy]) m[cy] = 0;
      return Object.keys(m).sort().reverse().map((k) => ({ key: k, count: m[k] }));
    }, [orders]);
    const activeYear = year === 'semua' || years.some((y) => y.key === year) ? year : 'semua';
    const months = useMemo(() => {
      if (activeYear === 'semua') return [];
      const m = {};
      orders.filter((o) => o.tanggal.slice(0, 4) === activeYear).forEach((o) => { const k = o.tanggal.slice(5, 7); m[k] = (m[k] || 0) + 1; });
      if (activeYear === todayISO().slice(0, 4)) { const cm = todayISO().slice(5, 7); if (!m[cm]) m[cm] = 0; }
      return Object.keys(m).sort().map((k) => ({ key: k, count: m[k] }));
    }, [orders, activeYear]);
    const activeMonth = activeYear !== 'semua' && months.some((m) => m.key === month) ? month : 'semua';
    const periodLabel = activeYear === 'semua' ? 'semua periode' : activeMonth === 'semua' ? `tahun ${activeYear}` : `${MONTHS[Number(activeMonth) - 1]} ${activeYear}`;

    const scoped = useMemo(() => sorted.filter((o) =>
      (activeYear === 'semua' || o.tanggal.slice(0, 4) === activeYear) &&
      (activeMonth === 'semua' || o.tanggal.slice(5, 7) === activeMonth)), [sorted, activeYear, activeMonth]);
    const rows = useMemo(() => {
      const k = q.trim().toLowerCase();
      return scoped.filter((o) => (filter === 'semua' || o.status === filter) && (progFilter === 'semua' || progressOf(o).key === progFilter) &&
        (!k || [o.id, o.nama, itemsText(o), o.wa, kodeFor(o)].some((x) => String(x || '').toLowerCase().includes(k)) ||
          (k.length >= 10 && k.includes(kodeFor(o).toLowerCase()))));
    }, [scoped, q, filter, progFilter]);
    const scan = useMemo(() => {
      const k = q.trim().toUpperCase();
      if (k.length < 20) return null;
      const o = orders.find((x) => k.includes(kodeFor(x)));
      const cek = k.match(/CEK ([A-Z0-9]{6})/);
      if (!o || !cek) return null;
      const st = (k.match(/STATUS (LUNAS|DP|BELUM BAYAR)/) || [])[1];
      return { o, valid: cek[1] === qrSig(o), st };
    }, [q, orders]);
    const counts = useMemo(() => ({ semua: scoped.length, lunas: scoped.filter((o) => o.status === 'lunas').length, dp: scoped.filter((o) => o.status === 'dp').length, belum: scoped.filter((o) => o.status === 'belum').length }), [scoped]);

    // Kembali ke halaman 1 saat pencarian, filter status, atau periode berubah
    useEffect(() => { setPage(1); }, [q, filter, progFilter, activeYear, activeMonth]);
    const pageCount = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    const curPage = Math.min(page, pageCount);
    const pageRows = rows.slice((curPage - 1) * PAGE_SIZE, curPage * PAGE_SIZE);
    const goPage = (n) => {
      setPage(n);
      const el = document.getElementById('daftar-pesanan');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    const saveOrder = (data, editing) => {
      setOrders((prev) => (editing ? prev.map((o) => (o.id === editing.id ? data : o)) : [data, ...prev]));
      const y = data.tanggal.slice(0, 4), m = data.tanggal.slice(5, 7);
      if (activeYear !== 'semua' && activeYear !== y) setYear(y);
      if (activeMonth !== 'semua' && (activeYear !== y || activeMonth !== m)) setMonth(m);
      setForm(null);
      setToast(editing ? 'Pesanan diperbarui' : 'Pesanan disimpan');
    };
    const setProgress = (id, key) => {
      setOrders((p) => p.map((o) => (o.id === id ? { ...o, progress: key } : o)));
      setToast('Status pekerjaan: ' + PROGRESS.find((x) => x.key === key).label);
    };
    const reportYears = useMemo(() => {
      const set = new Set(orders.map((o) => o.tanggal.slice(0, 4)));
      set.add(todayISO().slice(0, 4)); set.add(ym.slice(0, 4));
      return [...set].sort().reverse();
    }, [orders, ym]);
    const openInvoice = (o) => setInvoice(o);
    const exportData = async () => {
      const bytes = new TextEncoder().encode(JSON.stringify({ app: 'layera-story-dashboard', version: 1, exportedAt: new Date().toISOString(), orders, settings }, null, 2));
      try { await saveFile(`cadangan-${todayISO()}.json`, bytes, 'application/json'); setToast('Cadangan siap disimpan'); }
      catch (e) { setToast(e && e.code === 'declined' ? 'Unduhan dibatalkan' : 'Gagal membuat cadangan'); }
    };
    const importData = (d) => { setOrders(d.orders); setSettings(d.settings); setShowSettings(false); setToast(`${d.orders.length} pesanan diimpor`); };
    const removeOrder = () => { setOrders((p) => p.filter((o) => o.id !== delTarget.id)); setDelTarget(null); setToast('Pesanan dihapus'); };

    const chip = (k, label) => html`
      <button key=${k} onClick=${() => setFilter(k)}
        class="whitespace-nowrap rounded-full border px-3 py-1.5 text-xs font-semibold transition-colors ${filter === k ? 'border-accent bg-accent text-on-accent' : 'border-line bg-surface text-mute hover:text-ink'}">
        ${label} <span class="tabular-nums opacity-80">${counts[k]}</span>
      </button>`;

    return html`
      <div>
        <div class=${tab === 'laporan' ? '' : 'no-print'}>
          <header class="no-print sticky z-30 border-b border-line bg-surface/95 backdrop-blur" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
            <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 md:px-6">
              <div class="flex min-w-0 items-center gap-3">
                <img src=${LOGO_SRC} alt=${settings.nama || 'Layera Story'} width="900" height="299" draggable="false" class="h-9 w-auto shrink-0 select-none sm:h-10" />
                <p class="hidden min-w-0 truncate border-l border-line pl-3 text-xs text-mute md:block">Dashboard pesanan dan keuangan</p>
              </div>
              <div class="flex items-center gap-2">
                <button class="${btnGhost} !px-2.5" onClick=${() => setShowSettings(true)} aria-label="Pengaturan usaha"><${Icon} name="settings" size=${18} /></button>
                <button class="${btnGhost} !px-2.5" onClick=${() => setShowPw(true)} aria-label="Ganti password"><${Icon} name="key" size=${18} /></button>
                <button class=${btnGhost} onClick=${() => onLogout()} aria-label="Keluar"><${Icon} name="log-out" size=${18} /><span class="hidden sm:inline">Keluar</span></button>
                <button class=${btnPrimary} onClick=${() => setForm({ editing: null })}><${Icon} name="plus" size=${16} /> Pesanan baru</button>
              </div>
            </div>
            <nav class="mx-auto flex max-w-7xl gap-1 px-4 md:px-6" aria-label="Menu utama">
              ${[['pesanan', 'Pesanan', 'clipboard'], ['laporan', 'Laporan keuangan', 'chart']].map(([k, l, ic]) => html`
                <button key=${k} onClick=${() => setTab(k)} aria-current=${tab === k ? 'page' : null}
                  class=${'-mb-px inline-flex items-center gap-2 border-b-2 px-3 py-2.5 text-sm font-semibold transition-colors ' + (tab === k ? 'border-accent text-accent' : 'border-transparent text-mute hover:text-ink')}>
                  <${Icon} name=${ic} size=${16} />${l}
                </button>`)}
            </nav>
          </header>

          ${tab === 'laporan' ? html`
            <main class="print-flush mx-auto max-w-[230mm] space-y-4 px-4 py-5 md:px-6 md:py-8">
              <${ReportControls} ym=${ym} onYm=${setYm} years=${reportYears} />
              <${ReportView} orders=${orders} settings=${settings} ym=${ym} />
            </main>` : html`
          <main class="mx-auto max-w-7xl space-y-5 px-4 py-5 md:px-6 md:py-8">
            ${!remDismissed && html`<${ReminderBar} orders=${orders} onInvoice=${openInvoice} onDismiss=${() => setRemDismissed(true)} />`}
            <${PeriodBar} years=${years} months=${months} year=${activeYear} month=${activeMonth} total=${orders.length}
              onYear=${(y) => { setYear(y); setMonth('semua'); }} onMonth=${setMonth} />
            <${Summary} orders=${scoped} label=${periodLabel} />

            <section id="daftar-pesanan" class="scroll-mt-20 rounded-2xl border border-line bg-surface" aria-label="Daftar pesanan">
              <div class="flex flex-col gap-3 border-b border-line p-4 md:flex-row md:items-center md:justify-between">
                <h2 class="text-base font-bold">Daftar pesanan</h2>
                <div class="flex flex-col gap-3 md:flex-row md:items-center">
                  <div class="flex gap-2 overflow-x-auto pb-1 md:pb-0">${chip('semua', 'Semua')}${chip('lunas', 'Lunas')}${chip('dp', 'DP')}${chip('belum', 'Belum bayar')}</div>
                  <select class="${inp} md:!w-44" aria-label="Filter status pekerjaan" value=${progFilter} onChange=${(e) => setProgFilter(e.target.value)}>
                    <option value="semua">Semua pekerjaan</option>
                    ${PROGRESS.map((x) => html`<option key=${x.key} value=${x.key}>${x.label}</option>`)}
                  </select>
                  <div class="relative md:w-64">
                    <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-mute"><${Icon} name="search" size=${16} /></span>
                    <input class="${inp} pl-9" placeholder="Cari klien, invoice, kode, produk" value=${q} onChange=${(e) => setQ(e.target.value)} aria-label="Cari pesanan" />
                  </div>
                </div>
              </div>
              ${scan && html`
                <div role="status" class="mx-4 mt-3 rounded-lg px-3 py-2 text-sm font-medium ${scan.valid ? 'bg-good-soft text-good' : 'bg-warn-soft text-warn'}">
                  ${scan.valid
                    ? `QR cocok dengan ${scan.o.id}. Status terkini: ${STATUS[scan.o.status].label}.`
                    : `QR ${scan.o.id} berasal dari versi lama${scan.st ? ` (status saat itu: ${scan.st})` : ''}. Status terkini: ${STATUS[scan.o.status].label}. Cetak ulang invoice ini.`}
                </div>`}
              <${OrderList} rows=${pageRows} allRows=${rows} onInvoice=${openInvoice} onEdit=${(o) => setForm({ editing: o })} onDelete=${setDelTarget} onProgress=${setProgress} />
              <${Pagination} page=${curPage} pageCount=${pageCount} total=${rows.length} size=${PAGE_SIZE} onPage=${goPage} />
            </section>
          </main>`}
        </div>

        ${form && html`<${OrderForm} orders=${orders} editing=${form.editing} settings=${settings} onSave=${saveOrder} onClose=${() => setForm(null)} />`}
        ${invoice && html`<${InvoiceModal} key=${invoice.id} o=${orders.find((x) => x.id === invoice.id) || invoice} s=${settings} onClose=${() => setInvoice(null)} />`}
        ${showSettings && html`<${SettingsModal} settings=${settings}
            onSave=${(v) => { setSettings(v); setShowSettings(false); setToast('Pengaturan disimpan'); }}
            allowDemo=${SEED_DEMO && !WANT_SB} orderCount=${orders.length} onExport=${exportData} onImport=${importData}
            onReset=${() => { setOrders(seedOrders()); setShowSettings(false); setToast('Data contoh dipulihkan'); }}
            onClose=${() => setShowSettings(false)} />`}
        ${showPw && html`
          <${Modal} onClose=${() => setShowPw(false)} closeOnBackdrop=${false} width="max-w-md">
            <div class="rounded-2xl border border-line bg-surface p-5 sm:mt-16">
              <div class="mb-4 flex items-center justify-between">
                <h2 class="text-lg font-bold">Ganti password</h2>
                <button class="rounded-lg p-2 text-mute hover:bg-tint" onClick=${() => setShowPw(false)} aria-label="Tutup"><${Icon} name="x" /></button>
              </div>
              <${ChangePasswordForm} askCurrent=${true} onCancel=${() => setShowPw(false)}
                onSubmit=${async (cur, next) => { const r = await session.changePassword(cur, next); if (r.ok) { setShowPw(false); setToast('Password berhasil diganti'); } return r; }} />
            </div>
          <//>`}
        ${delTarget && html`
          <${Modal} onClose=${() => setDelTarget(null)} width="max-w-md">
            <div class="m-4 rounded-2xl border border-line bg-surface p-5 sm:mt-24">
              <h2 class="text-lg font-bold">Hapus pesanan ini?</h2>
              <p class="mt-2 text-sm text-mute">${delTarget.id} atas nama ${delTarget.nama} akan dihapus beserta rincian biayanya. Tindakan ini tidak bisa dibatalkan.</p>
              <div class="mt-5 flex justify-end gap-2">
                <button class=${btnGhost} onClick=${() => setDelTarget(null)}>Batal</button>
                <button class="${btn} bg-bad text-on-accent hover:opacity-90" onClick=${removeOrder}>Hapus pesanan</button>
              </div>
            </div>
          <//>`}
        ${toast && html`<div class="no-print fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 rounded-full bg-ink px-4 py-2 text-sm font-semibold text-surface shadow-lg" role="status">${toast}</div>`}
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(WANT_SB ? RootSB : Root));
})();
</script>
</body>
</html>
